[project]
name = "elai-inference"
version = "0.1.0"
description = "ELAI inference sidecar: HF Transformers with DoLa + TurboQuant + ActAdd steering"
requires-python = ">=3.10"

dependencies = [
    "torch>=2.2.0",
    "transformers>=4.45,<5",
    "numpy>=1.24",
    "bitsandbytes>=0.43.0",
    "safetensors>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[project.scripts]
elai-inference = "elai_inference.server:main"
