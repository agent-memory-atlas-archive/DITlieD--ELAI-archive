[project]
name = "elai-inference"
version = "0.1.0"
description = "ELAI inference sidecar: HF Transformers with DoLa + TurboQuant + ActAdd steering"
requires-python = ">=3.10"

dependencies = [
    "torch>=2.2.0",
    "transformers>=4.45,<5",
    "numpy>=1.24",
    # H-18 (Tier-2 sidecar): scipy for DSR/PBO/MinBTL computation via CSCV.
    # Anti-slopsquat verified 2026-06-05: pypi.org/pypi/scipy/json -> 1.17.1,
    # BSD-3-Clause license. scipy.stats.norm.cdf/ppf used for Phi/Phi_inv in
    # compute_dsr_pbo_minbtl() (deflation_sidecar.py). RunPod-pending (Tier-2).
    "scipy>=1.11",
    "bitsandbytes>=0.43.0",
    "safetensors>=0.4.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "orjson>=3.10.0",
    "structlog>=24.1.0",
    "lm-format-enforcer>=0.10.11",
    "autoawq>=0.2.0",
    "posthog>=3.0.0",
]

[project.optional-dependencies]
# E-28: FA2 mandatory on Ampere (RTX 3090/3060 sm_80/sm_86). flash-attn
# 2.8.3 (Jan 2026) supports CUDA 11.8-12.8 / torch 2.4-2.9. Anti-slopsquat
# verified 2026-06-22: pypi.org/pypi/flash-attn/json -> info.version
# 2.8.3.post1, BSD-3-Clause (classifiers). Pin >=2.8.3,<2.9 admits the
# post-release and any later 2.8.x patch. NO FA3/FA4 (Hopper/Blackwell only).
#
# Windows wheel fallback: flash-attn ships no official prebuilt Windows
# wheels, so it is an OPTIONAL extra, NOT a hard dependency — otherwise
# `pip install elai-inference` would fail on Windows. Install on the remote
# Linux 3090 only: `pip install -e '.[fa2]' --no-build-isolation`. On
# Windows the sidecar falls back to SDPA via the `import flash_attn`
# try/except in server.py (ELAI_FORCE_SDPA=1 path).
fa2 = [
    "flash-attn>=2.8.3,<2.9",
]
dev = [
    "pytest>=7",
    # C-28: T-1 mutation testing for Python sidecar code. Shelled out from
    # the orchestrator's PythonMutationRunner. See
    # workflow/reasoning/C-28-decisions.md DECISION-D8.
    "mutmut>=3.5.0",
]

[project.scripts]
elai-inference = "elai_inference.server:main"
