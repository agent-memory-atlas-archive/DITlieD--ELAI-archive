[project]
name = "elai-inference"
version = "0.1.0"
description = "ELAI inference sidecar: HF Transformers with DoLa + TurboQuant + ActAdd steering"
requires-python = ">=3.10"

dependencies = [
    "torch>=2.2.0",
    "transformers>=4.45,<5",
    "numpy>=1.24",
    "bitsandbytes>=0.43.0",
    "safetensors>=0.4.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "orjson>=3.10.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[project.scripts]
elai-inference = "elai_inference.server:main"
