[package]
name = "elai-orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
getrandom = "0.3"
elai-core = { path = "../core" }
elai-ipc-types = { path = "../ipc-types" }
elai-knowledge = { path = "../knowledge" }
elai-plugins = { path = "../plugins" }
elai-providers = { path = "../providers" }
elai-reasoning = { path = "../reasoning" }
elai-rules = { path = "../rules" }
# E-1 Task 4: PhaseSpec slot retarget — orchestrator's emit_memory_note_constraints
# (production) + the emit_mistake_book_constraints back-compat shim both read
# the new A-MEM note table via elai_memory::NoteStore + ppr_seeded_top_k. No
# new external crate is introduced — elai-memory is workspace-internal and
# already declared by reasoning/dashboard-v2/cli.
elai-memory = { path = "../memory" }
# B-28 E-1: focus_tunnel/fim.rs reuses Qwen FIM sentinels + strip_fim_artifacts
# from the scaffold crate (single source of truth for upstream-tokeniser-verified
# constants — see scaffold/src/fim.rs L38-48). Workspace-internal path dep only;
# scaffold itself does not depend on orchestrator (no cycle).
scaffold = { path = "../scaffold" }
elai-web-search = { path = "../web_search" }
elai-web-validator = { path = "../web_validator" }
# E-30: non-LLM argv allowlist + trust dialog ordering checks.
elai-safety = { path = "../safety" }
indexmap = { version = "2", features = ["serde"] }
rustc-hash.workspace = true
toml.workspace = true
regex = "1"
# I-13: write-time memory guard Stage-2 invisible-Unicode + confusable scan.
# aho-corasick v1.1.4 is already in Cargo.lock (transitive via regex); this
# line promotes it to a direct dep in this crate (same version, BurntSushi
# canonical crate, verified 2026-06-13). Anti-slopsquat: checksum confirmed in
# Cargo.lock: ddd31a130427c27518df266943a5308ed92d4b226cc639f5a8f1002816174301.
aho-corasick = "1.1.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
deadpool = { version = "0.13", features = ["managed", "rt_tokio_1"] }
# B-24 Phase 4I (Group C1): media-validator skeleton.
# bitflags 2.x is the spec-mandated representation for ToolCapabilityFlags
# (see docs/specs/guide/steps/phase-4I.txt section 4I.1, and the
# `tools.rs` interface block in workflow/sessions/s-31180/context-package.md).
bitflags = { version = "2.6", features = ["serde"] }
# image-compare 0.4 provides the pure-Rust SSIM (Algorithm::MSSIMSimple)
# used by the Tier-1 image validator. Pure-Rust is mandatory for the
# 1e-6 reproducibility budget (paper workflow/papers/ort-cpu-ep-interface.md L114-118).
image-compare = "0.4"
# Group C3: `image` crate for PNG decode in the Tier-1 SSIM path. Already
# transitively pulled in by `image-compare` (0.25.x) — pinning the same
# major to avoid duplicate resolutions. Default features include the PNG
# decoder which is all we need; we disable the other format decoders to
# keep the build graph small.
image = { version = "0.25", default-features = false, features = ["png"] }
# ort gated behind `vlm-integration`; Phase 0 ships the MockVlmBackend so
# CI does not require it. ort is pinned to the same `=2.0.0-rc.12` already
# used by elai-knowledge (paper ort-cpu-ep-interface.md L20-23 — 1.x line
# yanked).
#
# E-22 phase-4F M1 (2026-05-22): nvml-wrapper promoted to non-optional so
# `crates/orchestrator/src/system_probe.rs` can run the canonical
# `Nvml::init() -> device_by_index(n) -> device.memory_info()` path
# (mirroring `crates/orchestrator/src/media_validator/types.rs:493-519`)
# without a feature flag dance. nvml-wrapper 0.11 was already resolved in
# the workspace via `vlm-integration` + `providers/Cargo.toml:34`, so the
# build graph cost is unchanged. CLAUDE.md no-new-deps rule does not block
# (activation, not new dep). Graceful fallback when `Nvml::init()` returns
# Err (no NVIDIA driver / no GPU) is documented in
# `phase-4F.txt` risk R-4F-1.
ort = { version = "=2.0.0-rc.12", optional = true }
nvml-wrapper = "0.11"
rmp-serde = "1.3"
rusqlite.workspace = true
postcard.workspace = true
serde.workspace = true
thiserror.workspace = true
# Phase A1b: chokepoint wiring helpers in `runtime_setup` bubble step
# failures (mkdir / SSB init / rules.db open / Layer1A ensure_tables) via
# `anyhow::Error`, preserving the existing CLI error shape from
# `cli::runtime_builder`. Activating an already-declared workspace dep
# (Cargo.toml L40 — version "1") — no new external crate is introduced.
anyhow.workspace = true
serde_json.workspace = true
blake3 = { workspace = true }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "time", "sync", "fs"] }
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
# E-40 Tranche B-2: SymbolGraphDSL parser uses nom 7.x.
# nom 7.1.3 is already resolved in Cargo.lock (transitive via
# tantivy-query-grammar + spm_precompiled — see Cargo.lock L3794).
# Declaring it as a direct dep here does NOT pull a new crate into the
# build graph; per the Tranche B-2 prompt constraint "use nom which is
# already in Cargo.lock". Anti-slopsquatting verified (the canonical
# nom crate at crates.io/crates/nom, repo rust-bakery/nom).
nom = "7"
tracing.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
walkdir = "2"
# B-31 Phase 2 (Cycle A): resumable BM25 indexing reuses the ignore-aware
# walker pattern from elai-knowledge::bm25 (the workspace already pulls in
# `ignore` 0.4 via the knowledge crate — see Cargo.lock; this is NOT a new
# external dependency, only a re-declaration so the orchestrator crate can
# import `ignore::WalkBuilder` directly). See workflow/reasoning/B-31-decisions.md
# DECISION-5 + DECISION-9.
ignore = "0.4"
# B-31 Phase 3 (Cycle B, DECISION-11): cross-process file lock primitive.
# fd-lock 4.0.4 is already present in Cargo.lock as a transitive dependency
# of `rustyline` (see Cargo.lock L1733-1741). Declaring it directly here adds
# no new compiled code to the build graph — the crate was already resolved
# at the same version. Backed by POSIX flock() on Unix and LockFileEx on
# Windows via windows-sys (already a workspace transitive). See
# workflow/reasoning/B-31-decisions.md DECISION-11 + DECISION-13.
fd-lock = "4"
# H-49 (SCHEMA_VERSION 226): CAS object store for reversible LLM edits.
# zstd 0.13.3 is already in Cargo.lock as a transitive dep (via tantivy);
# declaring it directly gives the timetravel module an explicit import.
# Anti-slopsquatting verified (crates.io 2026-06-11): crate name "zstd",
# version 0.13.3, maintained, not yanked. See workflow/reasoning/H-49-decisions.md.
zstd = "0.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Isolation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
# B-31 Phase 3 (Cycle B): libc::kill(pid, 0) is the POSIX liveness check used
# by IndexLock::try_acquire to detect stale lock holders. libc was already
# declared for Linux only via the explicit linux block below; the unix block
# extends coverage to macOS/BSD so the cross-platform IndexLock compiles
# wherever fd-lock works. libc is already in the workspace graph.
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "0.5"
nix = { version = "0.31", features = ["fs", "mount", "sched", "signal"] }

[dev-dependencies]
proptest = "1.11"
proptest-state-machine = "0.8"
tempfile = "3"
# E-45 Tranche 8A: schemars for the boundary-types JSON Schema snapshot
# test (tests/schemas_snapshot.rs). Workspace-pinned EXACT 1.2.1 — the
# snapshot test asserts byte-equality against checked-in fixtures, so
# the derive macro output MUST stay stable across rebuilds.
schemars = { workspace = true }
tokio = { version = "1", features = ["test-util"] }
# E-44 Tranche 7B: Deterministic Simulation Testing (DST) harness for
# supervision-tree restart-ceiling invariants. madsim 0.2.31 published
# 2024-10-18 (verified crates.io 2026-05-31, not yanked, 161k+ downloads,
# part of madsim-rs/madsim under Apache-2.0/MIT). madsim-tokio 0.2.30 is the
# tokio-API shim used under `#[cfg(madsim)]`. Both are dev-only and the test
# file head carries `#![cfg(madsim)]` so default `cargo test` skips the
# harness entirely. Activate via:
#   RUSTFLAGS="--cfg madsim" cargo test -p elai-orchestrator --test agent_pool_dst
# Anti-slopsquatting verified: github.com/madsim-rs/madsim is the canonical
# upstream (used by RisingWave in production). See
# workflow/reasoning/E-44-madsim-decisions.md.
madsim = "0.2.31"
madsim-tokio = "0.2.30"
# B-20A Task 7: file_outline_force_full integration test calls
# `InProcessToolDispatcher::dispatch_file_read_with_force_full`. Cargo
# allows dev-dep cycles (`elai-tools` depends on `elai-orchestrator`)
# because dev-deps are not propagated to library builds.
elai-tools = { path = "../tools" }
# B2b: activate test-support feature so ipc_accept::test_support::ScriptedAgentRpcServer
# is accessible from integration tests in tests/. Self-dep is allowed for dev-dependencies.
elai-orchestrator = { path = ".", features = ["test-support"] }

[features]
default = []
# G-8 — cosign-keyless / Sigstore-Rekor transparency upgrade for the in-toto
# provenance attestation (attestation.rs). MARKER-ONLY today (NO dep added): the
# default signing path is a LOCAL blake3-Merkle proof requiring zero new deps
# (CLAUDE.md no-new-deps, DD1). This feature declares the gate so the
# `#[cfg(feature = "cosign-attest")]` arm in attestation.rs is recognized; the
# keyless signer body + its anti-slopsquat-verified dep (sigstore-rs /
# ed25519-dalek) land here ONLY after explicit confirmation. The crate MUST
# cargo-check-green WITHOUT this feature. See workflow/reasoning/G-8-decisions.md.
cosign-attest = []
# Exposes ipc_accept::test_support::ScriptedAgentRpcServer for use in contract
# tests outside the orchestrator crate. The module is always available to
# orchestrator's own integration tests (tests/) because cfg(test) is set there.
test-support = []
# C-35: forwards to elai-plugins/mcp so the orchestrator-side
# tool_gate_ssb_adapter (OrchestratorToolGateSsbEmitter) compiles. Activated
# by dashboard-v2 + cli when the dashboard's `mcp` feature is on.
mcp = ["elai-plugins/mcp"]
# Batch 1B: pass-through to providers crate's sidecar feature so the
# concrete `SidecarProviderSignalReader` compiles. The trait surface in
# `provider_signals` is unconditional; only the concrete impl is gated.
sidecar = ["elai-providers/sidecar"]
# D4: headless-browser fetch via obscura subprocess. Forwards the feature to elai-web-search.
obscura = ["elai-web-search/obscura"]
# B-24 Phase 4I: VLM (Tier 2) integration toggle. Off by default — Phase 0
# ships MockVlmBackend so CI runs without ONNX runtime or a CUDA-capable GPU.
# Enabling this feature pulls in `ort` (CPU EP for SSIM/LPIPS/CLAP). Note:
# nvml-wrapper is now a non-optional workspace dep (see E-22 phase-4F M1
# above) so it stays linked regardless of this feature; the
# `#[cfg(feature = "vlm-integration")]` arm in
# `media_validator/types.rs:493` controls only the VRAM-guard import path,
# not the dep presence itself.
vlm-integration = ["dep:ort"]
# B-24 Phase 4I Group C5 (4I.7 SKELETON): marker feature for the
# Render-Capture-Evaluate (RCE) surface. Today the feature is a pure
# marker (no extra deps) so the SKELETON in render_adapters/* compiles
# unconditionally. Group C6 wires real Playwright + ComfyUI adapters
# behind this flag; reqwest is already a non-optional workspace dep
# (Cargo.toml L23) so ComfyUI HTTP client does NOT require a new
# dependency. See workflow/reasoning/B-24-decisions.md decision 54.
media-validator-rce = []
# B-41: visual-audit marker feature. Off by default; reserved for B-43
# (rendered-dashboard visual audit). The AuditorMode::Visual variant in
# auditor_mode.rs is `#[cfg(feature = "visual_audit")]`-gated so no match-arm
# obligation propagates to downstream code until B-43 ships.
visual_audit = []
# Phase 4J / B-25 — Empire integration. Marker-only feature that compiles
# the `empire::*` submodule (FactoryLine client outline, BrainManifest,
# EmpireBridge state machine, 5-variant EmpireEventKind dispatcher). Off by
# default; the entire integration is host-side scaffolding behind
# `EMPIRE-PENDING` markers until the Empire codebase (workspace/factory-brain)
# is deployed. Non-empire builds pay zero compile/runtime cost.
empire = []
# C-43: hard CI gate for Phase 4H scope-freeze violations. When CI
# observes a ScopeFreezeViolated SSB row it enables this feature on the
# next build; the `compile_error!` in `scope_freeze.rs` then breaks the
# build with a pointer back to the ratification doc. Pure stable Rust —
# no custom clippy lint, no nightly toolchain. Off by default.
phase_4h_freeze_violated = []
# E-7: darwinian self-improvement substrate. Marker feature that compiles
# the new modules (template_archive, promotion_gate, est_probe,
# cross_domain_canary, trap_tasks, archive_crypto, l3_lock,
# darwinian_bai). Off by default; entire substrate is wire-dark until both
# this feature AND the `ELAI_DARWINIAN_LOOP_ENABLE` env var are set. Live
# model evolution loops RUNPOD-PENDING. See
# workflow/reasoning/E-7-decisions.md. ed25519-dalek dep deferred per
# anti-slopsquatting `cargo info` verification rule -- blake3 placeholder
# used in archive_crypto.rs scaffold.
darwinian-evolve = []
# J-19: forward vllm so model_family.rs cfg(feature="vllm") arms compile
# when contracts enables --features vllm
vllm = ["elai-providers/vllm"]

# 3B.bench — SSB single-writer insert throughput micro-benchmark. harness=false
# + std::time::Instant (orchestrator D2 / DRIFT-2: no criterion dep, mirrors the
# C-19 plugins bench). Grounds the 50K/sec claim ONLY once actually run; the
# number stays BLOCKED_MEASUREMENT until executed on a named host. Run:
#   cargo bench -p elai-orchestrator --bench ssb_throughput
[[bench]]
name = "ssb_throughput"
harness = false

# E-44 — AgentCheckpoint serialization format benchmark: msgpack vs postcard.
# Measures payload SIZE (bytes) and per-iteration LATENCY (ns) for
# rmp_serde::to_vec_named vs postcard::to_allocvec over AgentCheckpointData.
# harness=false + std::time::Instant, no criterion (D2/DRIFT-2 decision).
# Run:
#   cargo bench -p elai-orchestrator --bench checkpoint_format
# Auditor writes measured numbers to workflow/audits/E-44-checkpoint-format-bench-2026-05-19.md.
[[bench]]
name = "checkpoint_format"
harness = false

[lints.clippy]
all = { level = "warn", priority = -1 }

# E-44 Tranche 7B: register the `madsim` cfg name with rustc so the
# `unexpected_cfgs` lint does not warn on the `#![cfg(madsim)]` gate in
# tests/agent_pool_dst.rs. Activated only via RUSTFLAGS="--cfg madsim";
# unset under default builds (the file is excluded as intended).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(madsim)'] }
