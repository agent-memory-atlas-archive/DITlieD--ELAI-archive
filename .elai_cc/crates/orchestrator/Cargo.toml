[package]
name = "elai-orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
getrandom = "0.3"
elai-core = { path = "../core" }
elai-ipc-types = { path = "../ipc-types" }
elai-knowledge = { path = "../knowledge" }
elai-plugins = { path = "../plugins" }
elai-providers = { path = "../providers" }
elai-reasoning = { path = "../reasoning" }
elai-rules = { path = "../rules" }
# B-28 E-1: focus_tunnel/fim.rs reuses Qwen FIM sentinels + strip_fim_artifacts
# from the scaffold crate (single source of truth for upstream-tokeniser-verified
# constants — see scaffold/src/fim.rs L38-48). Workspace-internal path dep only;
# scaffold itself does not depend on orchestrator (no cycle).
scaffold = { path = "../scaffold" }
elai-web-search = { path = "../web_search" }
elai-web-validator = { path = "../web_validator" }
indexmap = { version = "2", features = ["serde"] }
rustc-hash.workspace = true
toml.workspace = true
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
deadpool = { version = "0.13", features = ["managed", "rt_tokio_1"] }
# B-24 Phase 4I (Group C1): media-validator skeleton.
# bitflags 2.x is the spec-mandated representation for ToolCapabilityFlags
# (see docs/specs/guide/steps/phase-4I.txt section 4I.1, and the
# `tools.rs` interface block in workflow/sessions/s-31180/context-package.md).
bitflags = { version = "2.6", features = ["serde"] }
# image-compare 0.4 provides the pure-Rust SSIM (Algorithm::MSSIMSimple)
# used by the Tier-1 image validator. Pure-Rust is mandatory for the
# 1e-6 reproducibility budget (paper workflow/papers/ort-cpu-ep-interface.md L114-118).
image-compare = "0.4"
# Group C3: `image` crate for PNG decode in the Tier-1 SSIM path. Already
# transitively pulled in by `image-compare` (0.25.x) — pinning the same
# major to avoid duplicate resolutions. Default features include the PNG
# decoder which is all we need; we disable the other format decoders to
# keep the build graph small.
image = { version = "0.25", default-features = false, features = ["png"] }
# ort and nvml-wrapper are gated behind `vlm-integration`; Phase 0 ships
# the MockVlmBackend so CI does not require either crate. ort is pinned to
# the same `=2.0.0-rc.12` already used by elai-knowledge (paper
# ort-cpu-ep-interface.md L20-23 — 1.x line yanked). nvml-wrapper version
# matches elai-providers (0.11) for workspace coherence.
ort = { version = "=2.0.0-rc.12", optional = true }
nvml-wrapper = { version = "0.11", optional = true }
rmp-serde = "1.3"
rusqlite.workspace = true
postcard.workspace = true
serde.workspace = true
thiserror.workspace = true
# Phase A1b: chokepoint wiring helpers in `runtime_setup` bubble step
# failures (mkdir / SSB init / rules.db open / Layer1A ensure_tables) via
# `anyhow::Error`, preserving the existing CLI error shape from
# `cli::runtime_builder`. Activating an already-declared workspace dep
# (Cargo.toml L40 — version "1") — no new external crate is introduced.
anyhow.workspace = true
serde_json.workspace = true
blake3 = { workspace = true }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "time", "sync", "fs"] }
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tracing.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
walkdir = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Isolation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
seccompiler = "0.5"
nix = { version = "0.31", features = ["fs", "mount", "sched", "signal"] }

[dev-dependencies]
proptest = "1.11"
proptest-state-machine = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
# B-20A Task 7: file_outline_force_full integration test calls
# `InProcessToolDispatcher::dispatch_file_read_with_force_full`. Cargo
# allows dev-dep cycles (`elai-tools` depends on `elai-orchestrator`)
# because dev-deps are not propagated to library builds.
elai-tools = { path = "../tools" }
# B2b: activate test-support feature so ipc_accept::test_support::ScriptedAgentRpcServer
# is accessible from integration tests in tests/. Self-dep is allowed for dev-dependencies.
elai-orchestrator = { path = ".", features = ["test-support"] }

[features]
default = []
# Exposes ipc_accept::test_support::ScriptedAgentRpcServer for use in contract
# tests outside the orchestrator crate. The module is always available to
# orchestrator's own integration tests (tests/) because cfg(test) is set there.
test-support = []
# Batch 1B: pass-through to providers crate's sidecar feature so the
# concrete `SidecarProviderSignalReader` compiles. The trait surface in
# `provider_signals` is unconditional; only the concrete impl is gated.
sidecar = ["elai-providers/sidecar"]
# D4: headless-browser fetch via obscura subprocess. Forwards the feature to elai-web-search.
obscura = ["elai-web-search/obscura"]
# B-24 Phase 4I: VLM (Tier 2) integration toggle. Off by default — Phase 0
# ships MockVlmBackend so CI runs without ONNX runtime or a CUDA-capable GPU.
# Enabling this feature pulls in `ort` (CPU EP for SSIM/LPIPS/CLAP) and
# `nvml-wrapper` (hardware guard for VlmProcessConfig::new — Mode A requires
# >= 24 GB VRAM per workflow/papers/qwen-vl-internvl-interface.md L30-37).
vlm-integration = ["dep:ort", "dep:nvml-wrapper"]
# B-24 Phase 4I Group C5 (4I.7 SKELETON): marker feature for the
# Render-Capture-Evaluate (RCE) surface. Today the feature is a pure
# marker (no extra deps) so the SKELETON in render_adapters/* compiles
# unconditionally. Group C6 wires real Playwright + ComfyUI adapters
# behind this flag; reqwest is already a non-optional workspace dep
# (Cargo.toml L23) so ComfyUI HTTP client does NOT require a new
# dependency. See workflow/reasoning/B-24-decisions.md decision 54.
media-validator-rce = []

[lints.clippy]
all = { level = "warn", priority = -1 }
