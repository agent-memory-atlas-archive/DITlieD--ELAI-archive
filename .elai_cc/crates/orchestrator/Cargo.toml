[package]
name = "elai-orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
elai-core = { path = "../core" }
elai-plugins = { path = "../plugins" }
elai-providers = { path = "../providers" }
elai-reasoning = { path = "../reasoning" }
elai-rules = { path = "../rules" }
glob = "0.3"
indexmap = { version = "2", features = ["serde"] }
toml.workspace = true
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
r2d2 = "0.8"
r2d2_sqlite = "0.33"
rmp-serde = "1.3"
rusqlite.workspace = true
serde.workspace = true
thiserror.workspace = true
serde_json.workspace = true
blake3 = "1.8"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "time", "sync", "fs"] }
tracing.workspace = true
uuid = { workspace = true }
walkdir = "2"

[dev-dependencies]
proptest = "1.11"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
