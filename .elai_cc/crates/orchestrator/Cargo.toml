[package]
name = "elai-orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
elai-core = { path = "../core" }
elai-plugins = { path = "../plugins" }
elai-providers = { path = "../providers" }
elai-reasoning = { path = "../reasoning" }
elai-rules = { path = "../rules" }
indexmap = { version = "2", features = ["serde"] }
toml.workspace = true
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
deadpool = { version = "0.13", features = ["managed", "rt_tokio_1"] }
rmp-serde = "1.3"
rusqlite.workspace = true
serde.workspace = true
thiserror.workspace = true
serde_json.workspace = true
blake3 = "1.8"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "time", "sync", "fs"] }
tracing.workspace = true
uuid = { workspace = true }
walkdir = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Foundation",
] }

[dev-dependencies]
proptest = "1.11"
proptest-state-machine = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
