[package]
name = "elai-safety"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
regex = "1"
blake3 = { workspace = true }
tracing = "0.1"
once_cell = "1"
# E-37: entropy-quarantine — Spotlight uses EntropySource for per-call random
# delimiters (never raw rand / std::random). elai-core provides the trait +
# OsEntropy / SeededRng impls.
elai-core = { path = "../core" }
# E-37: tool_description_pin persists per-tool blake3 hashes to TOML files
# at .elai/mcp/tool_descriptions/<server>/<tool>.toml (mirrors mcp_schema_pin
# layout in elai-plugins).
toml = { workspace = true }
# E-37: PromptArmor LLM classifier uses native `async fn in trait` (Rust 1.75+,
# workspace already mandates). async-trait crate is banned per CLAUDE.md
# anti-stale rule.

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt"] }

# E-30: argv-allowlist T1 latency benchmark (B-19 budget: p99 < 1ms).
# Uses harness=false + std::time::Instant — no criterion dep
# (anti-slopsquatting + CLAUDE.md "no new dependencies without confirmation";
# pattern matches the existing plugins/tiered_analysis_bench precedent).
[[bench]]
name = "argv_allowlist_latency"
harness = false
