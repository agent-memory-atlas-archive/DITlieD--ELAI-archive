[package]
name = "elai_plugins_macros"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# C-42b (Tranche M, s-22600) -- FIRST proc-macro crate in the workspace.
# Ships the #[authz] declarative attribute over the McpAuthz dispatcher
# surface defined at crates/plugins/src/authz/compose.rs::compose_with_tool_gate_emit.
#
# Anti-slopsquatting (CLAUDE.md HARD RULE, D-M7): all 4 proc-macro deps and
# the dev-only rand RNG are ALREADY transitively resolved in the workspace
# Cargo.lock today (verified 2026-06-01 via `grep '^name = "<dep>"'
# .elai_cc/Cargo.lock` + `cargo info <dep>`):
#
#   syn          2.0.117    (Cargo.lock L6232)
#   quote        1.0.45     (Cargo.lock L4962)
#   proc-macro2  1.0.106    (Cargo.lock L4798)
#   darling      0.20.11    (Cargo.lock L942)
#   rand         0.9.2      (Cargo.lock L5018; dev-dep only -- corpus generator)
#
# Adding the four proc-macro deps to this manifest produces ZERO lock churn.
# All five entries are pinned at the canonical anti-stale-training versions
# (rand >= 0.9, syn >= 2, darling >= 0.20). See workflow/reasoning/
# M-trancheM-decisions.md for the per-dep cargo-info trace.

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
darling = "0.20"

[dev-dependencies]
rand = "0.9"

[lints.clippy]
all = { level = "warn", priority = -1 }
