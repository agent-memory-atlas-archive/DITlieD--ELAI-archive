[package]
name = "elai-dashboard-v2"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "ELAI dashboard v2 (Tauri 2 + Svelte 5) — engine-wired backend."

[lib]
name = "elai_dashboard_v2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "elai-dashboard-v2"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["custom-protocol"] }
tauri-plugin-dialog = "2.7"
# H-11 (SCHEMA_VERSION 220): scoped filesystem surface for FileExplorer.
# Version 2.5.1 VERIFIED: already present in Cargo.lock as a transitive dep at
# 2.5.1 (tauri-plugin-fs in Cargo.lock L6667, anti-slopsquat verified in
# workflow/sessions/s-10612/exploration/H-11-integration.md). Compatible with
# tauri 2.11 (same ^2 major). Scoped to project_root; NEVER fs:default.
tauri-plugin-fs = "2.5.1"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
blake3 = { workspace = true }
git2 = { version = "0.20.4", default-features = false }
rusqlite = { workspace = true }
toml = { workspace = true }
rustc-hash = { workspace = true }
elai-core = { path = "../../core" }
# B-37D Wave-2A: AgentRole + IpcMessageType are referenced by the
# set_role_runtime / list_runtimes Tauri commands. Transitive promotion —
# elai-ipc-types is already a path-dep of elai-orchestrator (path = ../../ipc-types).
elai-ipc-types = { path = "../../ipc-types" }
elai-orchestrator = { path = "../../orchestrator", features = ["sidecar"] }
elai-providers = { path = "../../providers", features = ["sidecar"] }
elai-knowledge = { path = "../../knowledge" }
elai-reasoning = { path = "../../reasoning" }
elai-rules = { path = "../../rules" }
elai-plugins = { path = "../../plugins" }
elai-tools = { path = "../../tools" }
elai-memory = { path = "../../memory" }
elai-web-validator = { path = "../../web_validator" }
scaffold = { path = "../../scaffold" }

[features]
default = []
mcp = ["elai-plugins/mcp", "elai-orchestrator/mcp"]
# Phase 4J / B-25 — Empire integration. Activates the orchestrator's empire
# submodule so commands_empire's `#[cfg(feature = "empire")]` branch compiles
# the live read seam (vs. the deterministic empty-shape fallback). Off by
# default; non-empire dashboard builds render the "Empire bridge unavailable"
# empty state.
empire = ["elai-orchestrator/empire"]
# B-3 #27: AutoAdvanceStats panel + auto-advance gate machinery. Future-phase
# UI sneak-in from Phase 4G; flag gates the get_auto_advance_stats Tauri
# command + frontend render until B-22 lands the real autonomous-mode
# producer. Build w/ `--features autonomous-mode` to surface the panel; the
# default build emits a `cfg(not(feature="autonomous-mode"))` stub returning
# a zeroed shape so the frontend's runtime feature-flag query reads
# `autonomous_mode_enabled=false` and the panel hides itself.
autonomous-mode = []
# B-3 #28: ProposalsPanel (Phase 4H proposal flow). Future-phase UI
# sneak-in; flag gates the proposals data commands and the
# ProposalsPanel mount until B-23 lands the real self-modification
# producer. Same dual-cfg pattern as autonomous-mode above.
self-modification = []

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
