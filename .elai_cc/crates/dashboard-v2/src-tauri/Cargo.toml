[package]
name = "elai-dashboard-v2"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "ELAI dashboard v2 (Tauri 2 + Svelte 5) — engine-wired backend."

[lib]
name = "elai_dashboard_v2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "elai-dashboard-v2"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["custom-protocol"] }
tauri-plugin-dialog = "2.7"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
blake3 = { workspace = true }
git2 = { version = "0.20.4", default-features = false }
rusqlite = { workspace = true }
toml = { workspace = true }
elai-core = { path = "../../core" }
elai-orchestrator = { path = "../../orchestrator", features = ["sidecar"] }
elai-providers = { path = "../../providers", features = ["sidecar"] }
elai-knowledge = { path = "../../knowledge" }
elai-reasoning = { path = "../../reasoning" }
elai-rules = { path = "../../rules" }
elai-plugins = { path = "../../plugins" }
elai-tools = { path = "../../tools" }
elai-web-validator = { path = "../../web_validator" }
scaffold = { path = "../../scaffold" }

[features]
default = []
mcp = ["elai-plugins/mcp"]

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
