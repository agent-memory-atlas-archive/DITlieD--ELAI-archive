[package]
name = "elai_cc_contracts"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Test-only crate — no lib.rs, only integration tests.

[dev-dependencies]
elai-core = { path = "../core" }
elai-rules = { path = "../rules" }
elai-providers = { path = "../providers", features = ["sidecar"] }
elai-tools = { path = "../tools" }
elai-plugins = { path = "../plugins", features = ["mcp"] }
elai-knowledge = { path = "../knowledge", features = ["test-helpers"] }
elai-reasoning = { path = "../reasoning" }
# F-12: semantic_contradiction_threshold_contract.rs + no_cloud_judge_contract.rs
# drive the real elai_memory adjudication path (FactStore + adjudicate_semantic
# + the NliJudge trait). Path dep only; no new external crate.
elai-memory = { path = "../memory" }
elai-orchestrator = { path = "../orchestrator", features = ["sidecar", "test-support"] }
# E-54: eval-corpus crate. Contract test e54_eval_corpus_ssb_contract.rs
# asserts the IngestConfig defaults + schema validation + prod-traffic
# defaults-off + generator-rotation distribution + CorpusEventPhase
# 14-arm discriminator + SCHEMA_VERSION_PUBLIC == 167.
elai-eval-corpus = { path = "../eval-corpus" }
# Tranche M (s-22600) C-42b -- macro consumer for m_authz_macro_contract.rs.
# Decorates a sample fn with `#[authz(gate="...", tool_kind="...")]` so the
# compile of the contract test itself exercises the proc-macro expansion path.
# Zero workspace-lock churn (plugins_macros' four direct deps -- syn 2 /
# quote 1 / proc-macro2 1 / darling 0.20 -- are all pre-resolved in
# Cargo.lock today). Dev-dep only; no production wire-in.
elai_plugins_macros = { path = "../plugins_macros" }
# E-54: chrono needed by the e54 contract test fixture (Task.created_at).
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
# Tier 2 Track B: dashboard contract test imports `elai_dashboard_lib::commands::*`
# to assert the public surface of the 8 new tauri commands + DTOs.
# DISABLED in s-1430428: crates/dashboard moved to crates/.bkp_old/dashboard.
# The 4 dashboard_*_contract.rs files in tests/ are gated with #![cfg(any())].
# elai-dashboard = { path = "../dashboard" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
tempfile = "3"
# Phase B4 artifacts_pipeline_contract: blake3 is already a workspace-pinned
# dep (root Cargo.toml L41) used by elai-core and elai-orchestrator. Adding
# it as a dev-dep here just activates the existing pin — no new external
# crate is introduced (same precedent as `anyhow` in orchestrator/Cargo.toml L62).
blake3 = { workspace = true }
rusqlite.workspace = true
tokio = { workspace = true, features = ["test-util"] }
# WIRING-FIX-ELAI Phase 3 (SP4): tracing-test for the mandatory-assert rule's
# self-fixture + any #[traced_test] assertion in Layer-4 contract tests.
# Anti-slopsquatting verified live (crates.io API 2026-06-02): tracing-test
# max_stable=newest=0.2.6, v0.2.6 created 2026-02-07, NOT yanked, 29.3M total
# downloads, repository=https://github.com/dbrgn/tracing-test (canonical dbrgn,
# no typo-squat fork). KNOWN HAZARD (carried into
# .claude/rules/tracing-test-assert.md): `logs_contain` returns bool and does
# NOT auto-fail -- every #[traced_test] body MUST wrap it in assert!/assert_eq!
# or the test silently passes (fail-open). The auditor rule + checker enforce it.
tracing-test = { version = "0.2.6", features = ["no-env-filter"] }
# H-38: tracing required by tracing_test::traced_test macro (the macro calls
# tracing::subscriber and needs tracing in scope at the call site).
# workspace pin (0.1) — same version used by elai-orchestrator.
# no-env-filter is required because integration tests are a separate crate from
# the crate under test (elai-orchestrator); without it, tracing-test only captures
# logs from the integration test crate itself, not from elai-orchestrator.
# (tracing-test docs: "integration tests must use no-env-filter to capture logs")
tracing.workspace = true
rmp-serde = "1.3"
# I-41: InlineMockRuntime::stream() in i41_critique_lenses_contract.rs returns
# an empty BoxStream. futures-util already transitively resolved (via providers 0.3.32).
futures-util = "0.3"
# B-29 Phase 1 contract test (symbol_graph_b29_phase1_contract): postcard is
# the canonical encoder for symbol_graph blob columns; workspace dep already
# pinned at root Cargo.toml. No new external crate introduced.
postcard.workspace = true
rustc-hash.workspace = true
uuid = { workspace = true }
elai-web-search = { path = "../web_search" }
elai-web-validator = { path = "../web_validator" }
# E-30: public-incident hardening contract tests require the safety crate.
elai-safety = { path = "../safety" }
# Phase A2 — agent_loop_contract spawns elai_cc_agent and drives an IPC
# round-trip; both sides share the wire-protocol types from this crate.
elai-ipc-types.workspace = true
# Phase A (s-69820): website-creation pipeline contract test imports
# scaffold::{fim, build_vars} + apply_template_from_root + load_manifest.
scaffold = { path = "../scaffold" }
# Batch 2B contract tests: needed only to initialise a throwaway repo in
# the git_commit happy-path test. Same default-features=false treatment
# as the production pin in crates/tools.
git2 = { version = "0.20.4", default-features = false }
# Batch-ful-d: contract-test HTTP listener for the MCP JSON-RPC path. Uses
# tokio::net directly; no hyper/axum server dep needed.

[features]
default = []
# Batch-ful-d (FUL-D): forward the `mcp` feature to elai-plugins so the
# gated half of `fuld_mcp_bridge_contract.rs` can reach the HTTP JSON-RPC
# client. Contract test also compiles without this feature.
# C-47b CLI-arm: also forward to elai-orchestrator/mcp so the structural
# half of `c47b_case_base_persist_contract.rs` can reach the cfg(mcp)
# `McpClientDispatch::with_calibration_registry` builder. The source-grep
# assertion in that suite is feature-independent (reads the .rs text).
mcp = ["elai-plugins/mcp", "elai-orchestrator/mcp"]
# A.4-finish: forward the `obscura` feature to elai-orchestrator so the
# obscura branch of `fetcher_used_ssb_contract.rs` compiles when the
# headless-browser fetch path is enabled.
obscura = ["elai-orchestrator/obscura"]
# C-34: forward the `empire` feature to elai-orchestrator so the C-34
# contract test (c34_empire_integration_contract.rs) can import the
# `orchestrator::empire::*` types. The test file is `#[cfg(feature = "empire")]`-
# gated so a default `cargo test -p elai_cc_contracts` run is unaffected.
empire = ["elai-orchestrator/empire"]
# F-11: forward the `darwinian-evolve` feature to elai-orchestrator so the
# darwinian_admit contract tests compile against the REAL feature-gated
# `orchestrator::darwin_admit_loop` + `trap_tasks` + `promotion_gate` code, not
# a phantom (gotchas: a contract written against a feature-gated seam WITHOUT
# the forward compiles against an unrelated path = FALSE COVERAGE). The
# guard-chain + loop contract tests are `#[cfg(feature = "darwinian-evolve")]`-
# gated so a default `cargo test -p elai_cc_contracts` run is unaffected; the
# SSB-roundtrip contract is feature-INDEPENDENT (the action_type + payload live
# in always-compiled ssb.rs).
darwinian-evolve = ["elai-orchestrator/darwinian-evolve"]
