[package]
name = "elai_cc_contracts"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Test-only crate — no lib.rs, only integration tests.

[dev-dependencies]
elai-core = { path = "../core" }
elai-rules = { path = "../rules" }
elai-providers = { path = "../providers", features = ["sidecar"] }
elai-tools = { path = "../tools" }
elai-plugins = { path = "../plugins" }
elai-knowledge = { path = "../knowledge", features = ["test-helpers"] }
elai-reasoning = { path = "../reasoning" }
elai-orchestrator = { path = "../orchestrator", features = ["sidecar"] }
serde_json = { workspace = true }
toml = { workspace = true }
tempfile = "3"
rusqlite.workspace = true
tokio = { workspace = true, features = ["test-util"] }
rmp-serde = "1.3"
uuid = { workspace = true }
elai-web-search = { path = "../web_search" }
elai-web-validator = { path = "../web_validator" }
# Batch 2B contract tests: needed only to initialise a throwaway repo in
# the git_commit happy-path test. Same default-features=false treatment
# as the production pin in crates/tools.
git2 = { version = "0.20.4", default-features = false }
