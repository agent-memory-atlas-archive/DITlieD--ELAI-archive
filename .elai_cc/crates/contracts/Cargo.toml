[package]
name = "elai_cc_contracts"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Test-only crate — no lib.rs, only integration tests.

[dev-dependencies]
elai-core = { path = "../core" }
elai-rules = { path = "../rules" }
elai-providers = { path = "../providers", features = ["sidecar"] }
elai-tools = { path = "../tools" }
elai-plugins = { path = "../plugins" }
elai-knowledge = { path = "../knowledge", features = ["test-helpers"] }
elai-reasoning = { path = "../reasoning" }
elai-orchestrator = { path = "../orchestrator", features = ["sidecar"] }
# Tier 2 Track B: dashboard contract test imports `elai_dashboard_lib::commands::*`
# to assert the public surface of the 8 new tauri commands + DTOs.
# DISABLED in s-1430428: crates/dashboard moved to crates/.bkp_old/dashboard.
# The 4 dashboard_*_contract.rs files in tests/ are gated with #![cfg(any())].
# elai-dashboard = { path = "../dashboard" }
serde_json = { workspace = true }
toml = { workspace = true }
tempfile = "3"
rusqlite.workspace = true
tokio = { workspace = true, features = ["test-util"] }
rmp-serde = "1.3"
rustc-hash.workspace = true
uuid = { workspace = true }
elai-web-search = { path = "../web_search" }
elai-web-validator = { path = "../web_validator" }
# Phase A2 — agent_loop_contract spawns elai_cc_agent and drives an IPC
# round-trip; both sides share the wire-protocol types from this crate.
elai-ipc-types.workspace = true
# Phase A (s-69820): website-creation pipeline contract test imports
# scaffold::{fim, build_vars} + apply_template_from_root + load_manifest.
scaffold = { path = "../scaffold" }
# Batch 2B contract tests: needed only to initialise a throwaway repo in
# the git_commit happy-path test. Same default-features=false treatment
# as the production pin in crates/tools.
git2 = { version = "0.20.4", default-features = false }
# Batch-ful-d: contract-test HTTP listener for the MCP JSON-RPC path. Uses
# tokio::net directly; no hyper/axum server dep needed.

[features]
default = []
# Batch-ful-d (FUL-D): forward the `mcp` feature to elai-plugins so the
# gated half of `fuld_mcp_bridge_contract.rs` can reach the HTTP JSON-RPC
# client. Contract test also compiles without this feature.
mcp = ["elai-plugins/mcp"]
# A.4-finish: forward the `obscura` feature to elai-orchestrator so the
# obscura branch of `fetcher_used_ssb_contract.rs` compiles when the
# headless-browser fetch path is enabled.
obscura = ["elai-orchestrator/obscura"]
