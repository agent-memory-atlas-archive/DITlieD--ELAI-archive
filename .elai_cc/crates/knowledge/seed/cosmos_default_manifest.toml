# Default cosmos artifact manifest — B-42 Phase 1.
#
# Installed once at first boot into ~/.elai/cosmos/manifest.toml (user-global).
# Subsequent edits by the user are preserved; only freshly-introduced artifact
# names (added in a new ELAI release) are merged on upgrade.
#
# project_classes MUST be snake_case to match
# `orchestrator::idea_framing::ProjectClass` serde rename.
# Valid values: consumer_mobile_app | web_app | s_a_a_s_dashboard |
#               desktop_app | game_mod | research_tool | library_or_s_d_k |
#               c_l_i_tool | other
# (matches `ProjectClass` derive #[serde(rename_all = "snake_case")] at
#  orchestrator/src/idea_framing.rs:87-99).
#
# Refresh cadences are DESIGN ASSUMPTIONS supported by arXiv:2403.12958
# ("Dated Data") and arXiv:2511.14022 ("Keeping Code-Aware LLMs Fresh"),
# NOT empirically calibrated thresholds. They are easily tunable per-host
# by editing this manifest.
#
# Cosmos artifacts are non-code, user-global knowledge briefs. They are NOT
# a substitute for `[[knowledge.artifacts]]` per-project context (B-35); they
# augment it for cross-cutting concerns: marketplace policy, design heuristics,
# IP boundary case law, accessibility checklists.

