[package]
name = "elai-knowledge"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
serde_json.workspace = true
postcard.workspace = true
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-scala = "0.26"
tree-sitter-php = "0.24"
tree-sitter-swift = "0.7"
tree-sitter-bash = "0.25"
# Phase B (s-44680): web-domain grammars for Tier-2 AST predicates in
# data/rules/web.toml (WEB-013..WEB-023). Anti-slopsquatting verified
# via `cargo info` (2026-05-08): tree-sitter-html / tree-sitter-css are
# from the official tree-sitter org; tree-sitter-svelte-ng is from
# tree-sitter-grammars; tree-sitter-astro-next is single-maintainer
# (PRRPCHT) and therefore feature-gated.
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-svelte-ng = "1.0"
tree-sitter-astro-next = { version = "0.1", optional = true }
# C-17 (DRIFT-H): Kotlin grammar from official tree-sitter-grammars org.
# Anti-slopsquatting verified 2026-05-18 via `cargo search tree-sitter-kotlin`
# (repository: github.com/tree-sitter-grammars/tree-sitter-kotlin).
# E-42 Tier-B explicitly REJECTS the plan's `fwcd/tree-sitter-kotlin` fork
# request: fwcd is abandoned and is locked out by `crate::grammar_tier::
# BANNED_GRAMMAR_CRATES` + the `kotlin_uses_org_ng_variant_not_fwcd` contract
# test. The plan's wording is a stale 2025 snapshot; the canonical org -ng
# variant landed via C-17 anti-slopsquatting decision 2026-05-18. See
# workflow/reasoning/E-42-decisions.md DRIFT-1.
tree-sitter-kotlin-ng = "1.1"
rusqlite = { version = "0.39", features = ["bundled"] }
blake3 = "1.8"
regex.workspace = true
rustc-hash.workspace = true
tracing.workspace = true
tantivy = "0.26"
elai-core = { path = "../core" }
elai-ipc-types = { path = "../ipc-types" }
elai-rules = { path = "../rules" }
# phase-3L: PI Tier hooks reuse HookVerdict from the plugins hook family
# (per workflow/papers/tiered_analysis-interface.md "Re-use HookVerdict +
# TieredAnalysisResult so the dispatch contract stays uniform").
elai-plugins = { path = "../plugins" }
ort = "=2.0.0-rc.12"
tokenizers = { version = "0.22", default-features = false, features = ["progressbar", "onig"] }
tokio = { version = "1", features = ["sync"] }
toml.workspace = true
uuid.workspace = true
ignore = "0.4"
globset = "0.4"
usearch = { version = "2.25.2", default-features = false, optional = true }
# J-33 Tier-1: reqwest blocking client for the MinerU `serve` /file_parse
# doc-parser lane (crates/knowledge/src/doc_parser_client.rs). Workspace
# already pins reqwest 0.12 with json+rustls-tls; we enable blocking+multipart
# here because the doc-parser POST is a synchronous caller (artifact indexer).
# Same feature set as crates/cli and crates/tools.
reqwest = { workspace = true, features = ["blocking", "multipart"] }

[features]
default = []
usearch-hnsw = ["usearch"]
splade = []
test-helpers = []
# Phase B: opt-in Astro grammar (single-maintainer crate).
web-astro = ["dep:tree-sitter-astro-next"]
# E-42 Tier-B: opt-in registration helper for community-curated grammars
# that may emit ERROR nodes on uncommon idioms. The Tier-A canonical set
# remains the default-on registration; this feature simply exposes a named
# seam (crate::tree_sitter::registration::register_tier_b_languages) so
# audits + dashboard surfaces can discriminate Tier-A vs Tier-B loads.
# Does NOT add new crate deps — the underlying grammars (scala / swift /
# php / bash) are already pinned for the existing flat block. Anti-
# slopsquatting + user authorization required before adding deps for
# json / yaml / toml / markdown / vue at Tier-B (see
# workflow/reasoning/E-42-decisions.md DRIFT-8).
experimental_grammars = []

[dev-dependencies]
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
tracing-subscriber = { version = "0.3", features = ["registry"] }

[[bench]]
name = "symbol_graph_scale"
harness = false

[[bench]]
name = "scale_memory"
harness = false

[[bench]]
name = "workload"
harness = false

[lints.clippy]
all = { level = "warn", priority = -1 }
