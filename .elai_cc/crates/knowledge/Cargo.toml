[package]
name = "elai-knowledge"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
rusqlite = { version = "0.39", features = ["bundled"] }
blake2 = "0.10"
log = "0.4"
tantivy = "0.26"
elai-core = { path = "../core" }
ort = "2.0.0-rc.12"
tokenizers = { version = "0.22", default-features = false, features = ["progressbar", "onig"] }
tokio = { version = "1", features = ["sync"] }
toml.workspace = true
tracing.workspace = true
uuid.workspace = true
usearch = { version = "2.24.0", default-features = false, optional = true }

[features]
default = []
usearch-hnsw = ["usearch"]
splade = []

[dev-dependencies]
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
tracing-subscriber = { version = "0.3", features = ["registry"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
