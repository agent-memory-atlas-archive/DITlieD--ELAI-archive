[package]
name = "elai-eval-corpus"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# E-54: eval-corpus crate.
# Repairs D-6 PLANNED 9-gram filter with 13-gram + embedding-cosine +
# per-family directory shards + test-triplet schema + matched-pair sycophancy
# probes + KOR-orthogonality check on D-7. CanaryFamily (5-arm) is the
# canonical task family surface; KnowledgeQa is routed via ToolUse-flavored
# tasks per workflow/reasoning/E-54-decisions.md DECISION-1.

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
blake3.workspace = true
toml.workspace = true
rustc-hash.workspace = true
tokio = { version = "1", features = ["sync", "macros", "rt", "rt-multi-thread", "time", "fs"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Re-uses normalize_text / content_hash / ngram_filter / jaccard_overlap from
# orchestrator::held_out (see E-54-decisions.md DECISION-2; avoids primitive
# duplication. orchestrator does NOT depend on eval-corpus, so no cycle).
elai-orchestrator = { path = "../orchestrator" }
tracing.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util", "macros", "rt", "rt-multi-thread"] }

[features]
default = ["cosine-filter"]
# E-54: cosine-filter feature gates the embedding-cosine second filter (BGE-M3
# / Nomic Embed v2 via sidecar embeddings endpoint). Default-on; opt-out via
# --no-default-features. Per CLAUDE.md "No new dependencies without
# confirmation": the sidecar dep is HTTP-only (reqwest, already in
# orchestrator); no new compiled deps land when feature is off.
cosine-filter = []

[lints.clippy]
all = { level = "warn", priority = -1 }
