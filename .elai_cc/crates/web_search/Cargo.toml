[package]
name = "elai-web-search"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
elai-core = { path = "../core" }
futures-util = "0.3"
rustc-hash.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true }
toml.workspace = true
tracing.workspace = true
url = "2"
# E-48 Task 2: blake3 used to canonicalize URLs for the
# TieredSearchPool dedup hash. CLAUDE.md anti-stale-training HARD RULE:
# blake3 ONLY; no blake2 / sha2. workspace declaration so the version
# tracks the rest of the codebase.
blake3 = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt"] }

[features]
# D4: enables ObscuraFetcher (headless-browser subprocess). Off by default.
# Requires the obscura binary; see tools/obscura/. Selected at runtime via ELAI_FETCHER=obscura.
obscura = []

[lints.clippy]
all = { level = "warn", priority = -1 }
