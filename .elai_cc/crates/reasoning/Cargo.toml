[package]
name = "elai-reasoning"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
elai-core = { path = "../core" }
elai-providers = { path = "../providers" }
elai-memory = { path = "../memory" }
# tools/ cannot be a path dep: tools/ -> orchestrator/ -> reasoning/ creates a
# circular dependency. FILE_CHECK and SOURCE_CHECK use the FileReader trait
# (verification.rs) which decouples reasoning/ from tools/ at the trait level.
# StdFileReader provides the production impl via std::fs; tools/ injects richer
# implementations at the orchestrator seam when needed.
rustc-hash.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
regex = "1"
tracing.workspace = true

[[bench]]
name = "grc_bench"
harness = false

[[bench]]
name = "verification_bench"
harness = false

[[bench]]
name = "config_bench"
harness = false

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt", "macros"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
