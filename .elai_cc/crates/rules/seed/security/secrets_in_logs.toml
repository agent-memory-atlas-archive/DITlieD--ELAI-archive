# F-2c security ruleset -- Secrets Written to Logs (CWE-532)
# mutable=0: immutable seed rows, lifecycle-immune.
# Scope: python + typescript production code.
# GrepPattern-ONLY (F-2c controller decision -- NoOpAst makes Composite AST
# children wire-dark on the live gate).
# SEVERITY NOTE: shipped as BLOCK, not WARN. evaluate_vibegate's code-vuln axis
# (vibegate.rs:238) only surfaces a HookFinding for a Block verdict; a WARN rule
# is gate-silent (no finding) AND invisible to the seccodeplt bench (gate_recall
# would stay 0 for this class). FP is instead bounded by a CONJUNCTION in one
# anchored regex: a high-signal log sink (logging.* / logger.* / print /
# console.*) AND a secret-named identifier inside the SAME call argument list.
# A benign log line with no secret identifier does NOT fire.

[[rules]]
rule_id = "SEC-LOG-001"
domain = "security"
tier = 1
severity = "BLOCK"
title = "Secret in logs: Python secret-named identifier in a logging/print sink (CWE-532)"
predicate_json = '{"type":"grep_pattern","pattern":"(logging\\.(info|debug|warning|error|critical)|logger\\.[a-z]+|print)\\s*\\([^)\\n]*(password|passwd|secret|token|api_key|apikey)","scope":null,"context_lines":2,"language":"python","file_context":"production"}'
phase_mask = 4294967295

[[rules]]
rule_id = "SEC-LOG-002"
domain = "security"
tier = 1
severity = "BLOCK"
title = "Secret in logs: TypeScript secret-named identifier in a console sink (CWE-532)"
predicate_json = '{"type":"grep_pattern","pattern":"console\\.(log|info|error|warn|debug)\\s*\\([^)\\n]*(password|passwd|secret|token|api_key|apikey)","scope":null,"context_lines":2,"language":"typescript","file_context":"production"}'
phase_mask = 4294967295
