[package]
name = "elai-providers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
elai-core = { path = "../core" }
elai-ipc-types.workspace = true
# E-35: blake3 schema-hash key for the XGrammar grammar cache
# (CLAUDE.md anti-stale: blake3, NEVER blake2/sha2). Already workspace-pinned
# at 1.8 — no new external crate.
blake3.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rustc-hash.workspace = true
tracing = { workspace = true }
serde.workspace = true
serde_json.workspace = true
# E-45 Tranche 8A: JsonSchema derive on the 5 sidecar-boundary structs in
# src/types.rs (MessageRequest / MessageResponse / InputMessage /
# SystemBlock / ToolDefinition). The derive is additive — existing serde
# tags + skip_serializing_if rules are unchanged. Snapshot test lives in
# elai-orchestrator dev-deps so this crate stays runtime-clean.
schemars = { workspace = true }
getrandom = "0.3"
sha2 = "0.10"
thiserror.workspace = true
# I-51 — model capability catalog (models.toml parsing). Activates the workspace
# pin (toml = "1" at root Cargo.toml L57) — no new external crate introduced.
toml.workspace = true
safetensors = "0.7"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
# B-37A multi-runtime adapter: BoxStream + stream::unfold for the
# RuntimeAdapter streaming surface. Already workspace-promoted via
# web_search (0.3 pin) per CLAUDE.md grounded-by-default. No new
# external crate is introduced.
futures-util = "0.3"
nvml-wrapper = { version = "0.11", optional = true }
# J-64 — ACP (Agent Client Protocol) transport for agent bridges.
# Pinned to 0.15.0 per plan (anti-slopsquat-verified 2026-07-25 via docs.rs:
# not yanked, no advisory, Apache-2.0). The ACP crate provides JSON-RPC over
# stdio for driving external agent CLIs (claude-agent-acp etc) through the
# SAME cli_common::spawn_isolated_with_event Tier-C isolation seam.
agent-client-protocol = "=0.15.0"
# J-64 — tokio-util compat bridge: ACP's ByteStreams requires
# futures::AsyncRead/AsyncWrite but cli_common::spawn_isolated returns
# tokio::process::Child stdio. tokio-util is already a transitive dep
# (v0.7.17 via reqwest/tokio-rustls); promoting to direct with "compat"
# to access TokioAsyncReadCompatExt / TokioAsyncWriteCompatExt.
tokio-util = { version = "0.7", features = ["compat"] }

[dev-dependencies]
# I-34: grammar_store tests create temp EBNF fixtures + manifests for pin
# verification. Same version used by orchestrator / contracts / cli (see
# workspace Cargo.toml — not yet a workspace dep, pinned per-crate at "3").
tempfile = "3"

[features]
default = []
vllm = ["nvml-wrapper"]
sidecar = []
turboquant = []

[lints.clippy]
all = { level = "warn", priority = -1 }
