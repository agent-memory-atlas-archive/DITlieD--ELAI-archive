[package]
name = "elai-plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
elai-core = { path = "../core" }
elai-rules = { path = "../rules" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml = { workspace = true, optional = true }
lru.workspace = true
rustc-hash.workspace = true
thiserror = "2.0"
blake3.workspace = true
# C-47b (Tranche D, s-22600): rusqlite-backed persistence layer for the
# C-47 case base lives under tool_calibration/persist.rs. Workspace pin
# (0.39, bundled+array+hooks) is in F:\.ELAI_workflow\.elai_cc\Cargo.toml:50;
# 7 other crates already consume it (contracts, cli, memory, rules,
# dashboard-v2/src-tauri, knowledge, orchestrator). No new external dep is
# pulled into the build graph -- declaring it here only adds plugins to
# the consumer list. Anti-slopsquatting verified via existing workspace pin.
rusqlite = { workspace = true }
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-ruby = "0.23"
tracing.workspace = true
regex.workspace = true
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
# Batch-ful-d (FUL-D): gated behind the `mcp` feature. The HTTP JSON-RPC
# client lives in `mcp_bridge::jsonrpc`. Workspace already pins reqwest 0.12
# rustls-tls in other crates; we reuse the same pin (no new dep).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

[features]
default = []
# Batch-ful-d: enabling `mcp` activates the reqwest-backed JSON-RPC client.
mcp = ["dep:reqwest", "dep:toml"]

[dev-dependencies]
tempfile = "3"
# C-42 (session 2): proptest + proptest-state-machine for the authz fuzz
# harness (plugins/src/authz/fuzz.rs). Same workspace pin orchestrator already
# uses (see crates/orchestrator/Cargo.toml:128-129); no new external dep.
proptest = "1.11"
proptest-state-machine = "0.8"

[lints.clippy]
all = { level = "warn", priority = -1 }

# C-19 §Phase-4C: tiered analysis benchmark. Matches workspace precedent
# (knowledge/, reasoning/ crates): harness=false + std::time::Instant, no
# criterion dep (orchestrator D2 / DRIFT-2; CLAUDE.md "no new dependencies
# without confirmation").
[[bench]]
name = "tiered_analysis_bench"
harness = false

[[test]]
name = "tool_gate_contract"
path = "tests/contracts/tool_gate_contract.rs"
required-features = ["mcp"]