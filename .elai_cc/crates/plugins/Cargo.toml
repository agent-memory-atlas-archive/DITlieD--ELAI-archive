[package]
name = "elai-plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
elai-core = { path = "../core" }
elai-rules = { path = "../rules" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml = { workspace = true, optional = true }
lru.workspace = true
rustc-hash.workspace = true
thiserror = "2.0"
blake3.workspace = true
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-ruby = "0.23"
tracing.workspace = true
regex.workspace = true
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
# Batch-ful-d (FUL-D): gated behind the `mcp` feature. The HTTP JSON-RPC
# client lives in `mcp_bridge::jsonrpc`. Workspace already pins reqwest 0.12
# rustls-tls in other crates; we reuse the same pin (no new dep).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

[features]
default = []
# Batch-ful-d: enabling `mcp` activates the reqwest-backed JSON-RPC client.
mcp = ["dep:reqwest", "dep:toml"]

[dev-dependencies]
tempfile = "3"

[lints.clippy]
all = { level = "warn", priority = -1 }

# C-19 §Phase-4C: tiered analysis benchmark. Matches workspace precedent
# (knowledge/, reasoning/ crates): harness=false + std::time::Instant, no
# criterion dep (orchestrator D2 / DRIFT-2; CLAUDE.md "no new dependencies
# without confirmation").
[[bench]]
name = "tiered_analysis_bench"
harness = false

[[test]]
name = "tool_gate_contract"
path = "tests/contracts/tool_gate_contract.rs"
required-features = ["mcp"]