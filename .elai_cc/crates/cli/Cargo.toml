[package]
name = "elai-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "elai"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
# E-17 SP1: `elai doctor knowledge-models` hashes tokenizer.json bytes and
# the first 256 bytes of each ONNX model. Workspace pin keeps cli, core,
# and knowledge on the same blake3 version (CLAUDE.md anti-stale: never
# blake2/sha2 for non-RFC uses).
blake3 = "1.8"
crossterm = "0.28"
elai-core = { path = "../core" }
elai-knowledge = { path = "../knowledge", features = ["splade"] }
elai-orchestrator = { path = "../orchestrator" }
elai-plugins = { path = "../plugins", features = ["mcp"] }
elai-providers = { path = "../providers", features = ["sidecar"] }
elai-reasoning = { path = "../reasoning" }
elai-rules = { path = "../rules" }
# E-37: prompt-injection defense — safety_cmd dispatch uses the safety
# crate's classifier + spotlight + pin surface for `elai safety` operator
# commands.
elai-safety = { path = "../safety" }
# E-1 Task 6+8: deterministic-preamble emitter (top-K PPR notes streamed
# synchronously before the model's first token) + SLEEP_COMPUTE substate
# trigger surface. Both read NoteStore directly from the LiveCli loop —
# routing through reasoning's chat_memory_reflect re-exports would still
# work but reads cleaner as a direct dep. Workspace-internal path dep
# already declared by orchestrator + reasoning + dashboard-v2 (no new
# external crate).
elai-memory = { path = "../memory" }
elai-tools = { path = "../tools" }
# A5.2: optional; activated by the "obscura" feature for doctor() wiring.
elai-web-search = { path = "../web_search", optional = true }
pulldown-cmark = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
rustc-hash.workspace = true
rustyline = "15"
semver = "1"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
syntect = "5"
tokio = { version = "1", features = ["rt-multi-thread", "signal", "time", "sync"] }
toml.workspace = true
# A1a — `run` subcommand opens the project rules.db and wraps the
# `rusqlite::Connection` in `Arc<tokio::sync::Mutex<_>>` for the
# `DefaultLayer1aProcessor` constructor (production callsite of
# `self_mod_layer1a.rs:486`). Workspace pin matches elai-orchestrator.
rusqlite = { workspace = true }
# C-27: per-audit-run correlator uuid::Uuid::new_v4() in wiring_audit.rs.
# Already a workspace dep at .elai_cc/Cargo.toml; activating v4 feature here
# does not pull a new external crate (already in the build graph via
# orchestrator + several other workspace crates).
uuid = { workspace = true, features = ["v4", "serde"] }

[dev-dependencies]
# D-8: archive-verify in-crate unit tests + tests/archive_verify_smoke.rs
# integration test build temporary JSONL archive fixtures. Same pin used by
# elai-orchestrator + elai_cc_contracts (Cargo.toml L26 of contracts crate).
tempfile = "3"

[features]
default = ["mcp"]
# D4: pass-through to orchestrator's obscura feature (headless-browser fetch via obscura subprocess).
# Also enables elai-web-search/obscura directly so doctor.rs can call obscura_fetcher::doctor().
# Enable with: cargo build --features obscura
obscura = ["elai-orchestrator/obscura", "elai-web-search/obscura", "dep:elai-web-search"]
# C-39: mcp feature gates the CliMcpClient HTTP-bridge calls. Enabled by
# default because the CLI ships elai-plugins with `features = ["mcp"]`
# unconditionally; the feature flag here exists so the cfg(feature="mcp")
# gates in mcp_client.rs are not flagged as "unexpected" by check-cfg.
# C-47b CLI-arm: also forward to elai-orchestrator/mcp so the cfg(mcp)
# `McpClientDispatch::with_calibration_registry` builder + the gated
# call-path switch in dispatch/mcp.rs are compiled in lock-step with the
# CLI-side registry-wiring block in run_subcommand.rs (both keyed on the
# CLI's own `mcp` feature, which is in the default set).
mcp = ["elai-plugins/mcp", "elai-orchestrator/mcp"]
# E-7: enable the darwinian-evolve substrate in the CLI binary. Pure
# cfg-gate pass-through to elai-orchestrator/darwinian-evolve (no new
# external deps). Required for `elai darwin-loop`. See
# workflow/reasoning/E-7-decisions.md DECISION-13.
darwinian-evolve = ["elai-orchestrator/darwinian-evolve"]

[lints.clippy]
all = { level = "warn", priority = -1 }
