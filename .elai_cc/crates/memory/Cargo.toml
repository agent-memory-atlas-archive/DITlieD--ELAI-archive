blake3 = { workspace = true }
# D-8 unblock: pre-existing E-5 source uses rustc_hash::FxHashSet but the
# dep was not declared. Workspace pin already exists at root Cargo.toml L45.
rustc-hash = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints.clippy]
all = { level = "warn", priority = -1 }
