[package]
name = "elai-web-validator"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# WEB.3: runtime verification of generated websites.
# Self-contained — does NOT depend on orchestrator (circular dep prevention).

[dependencies]
reqwest = { workspace = true }
serde = { workspace = true }
# Phase B (s-44680): lint::run_web_lint and cwv::run_lighthouse parse JSON
# from external tool subprocesses. Promotes from dev-dependency to runtime
# dependency.
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
elai-core = { path = "../core" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util", "macros", "rt", "rt-multi-thread"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
