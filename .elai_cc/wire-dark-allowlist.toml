# 1C-R4 DECISION: BruteForceIndex is the PERMANENT production default vector
# index (crates/knowledge/src/vector/indexer.rs constructs BruteForceIndex
# unconditionally). It is a pure-Rust cosine scan, O(n*d) per query, and the
# code comment at hnsw_index.rs:142-143 documents it as suitable for project-
# scale corpora (hundreds to low thousands of vectors) -- the ELAI target. No
# measured number (1C-R3 is BLOCKED_MEASUREMENT) shows brute-force is a
# bottleneck, so promoting HNSW now would be ungrounded.
#
# `usearch-hnsw` (cargo feature, default-OFF; pulls the native usearch 2.25.2
# C++ dep) is the OPT-IN large-corpus escape hatch. It is wire-dark BY DESIGN
# today: UsearchIndex is cfg-gated and has ZERO production callers -- the
# indexer still uses BruteForceIndex even with the feature ON, so enabling it
# changes nothing. The promotion step (the work B-16 must do to flip it on) is
# to make indexer.rs select UsearchIndex when the feature is compiled AND a
# corpus-scale benchmark (the blocked 1C-R3 measurement) proves brute-force is
# too slow at the live corpus size. Until that swap + measurement exist, this
# stays an experiment with the existing cfg-gated round-trip as its ON-path
# smoke. NOTE: added by an executing run -- trips gate_freeze_check.py until
# re-locked out-of-band (`python .claude/tools/gate_freeze_check.py --lock`).
[[flag]]
name              = "usearch-hnsw"
type              = "experiment"
owner             = "phase-1C/B-16"
expiry_date       = "2026-09-01"
promotion_plan_id = "B-16"
smoke_test        = "crates/knowledge/src/vector/hnsw_index.rs::tests::test_hnsw_index_persistence_roundtrip"

