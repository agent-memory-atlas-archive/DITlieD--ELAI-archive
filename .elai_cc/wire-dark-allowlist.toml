# wire-dark-allowlist.toml - gate-owned (rule R9, frozen via .claude/gate-manifest.txt).
#
# A new default-OFF flag (ELAI_*_ENABLE, cargo feature) FAILS the wiring gate UNLESS
# it has an [[flag]] row here. Default-off is not a terminal state; a flag with no
# promotion path is wire-dark by design (Fowler time-bomb, Statsig STALE_ALL_FALSE,
# Samsara inversion - see WIRING-ENFORCEMENT-RESEARCH-2026-06-02.md section 3.7).
#
# This file is authored out-of-band; a plan run being evaluated by the gate may not
# edit it (gate_freeze_check.py enforces R8). After a reviewed change, re-lock:
#   python .claude/tools/gate_freeze_check.py --lock
#
# Schema (every field required; a row missing any field does NOT grant an exemption):
#   [[flag]]
#   name              = "ELAI_X_ENABLE"   # exact flag / cargo-feature name
#   type              = "experiment"      # "kill_switch" (ops, may be long-lived) or
#                                         # "experiment" (must promote or die)
#   owner             = "name"            # who is accountable for promotion/removal
#   expiry_date       = "YYYY-MM-DD"      # hard date; past expiry is a build break
#   promotion_plan_id = "E-NN"            # the plan that flips it on by default
#   smoke_test        = "..."            # the test that exercises the ON path
#
# ---- ACTIVE EXEMPTIONS ----
# D-FZ population (R9). Each row carries ALL six required fields; a row missing any
# field grants NO exemption. expiry_date is a hard date (past expiry = build break).
# smoke_test names the test that drives the ON path; the auditor verifies it exists
# and exercises the flag-ON branch (Layer-3/4). The first four are the known E-plan
# wire-dark flags (grounded from CLAUDE.md E-38/E-10/E-43/E-31 pointers); the fifth
# exempts the wiring-fix loop-trigger stub introduced this build (see note below).

