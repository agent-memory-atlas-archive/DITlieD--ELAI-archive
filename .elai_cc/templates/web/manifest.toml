# ELAI web starter template manifest.
# Versions pinned exact. Verified via `npm view` on 2026-04-17.
# vanilla: build_command empty = no build step, static files only.

[[template]]
name = "vite-svelte"
description = "Vite + Svelte + TypeScript starter with section taxonomy"
languages = ["svelte", "ts", "css"]
build_command = "npm run build"
dev_command = "npm run dev"
dev_port = 5173
recommended_for = ["portfolio", "dashboard", "app", "marketing-site"]
model_familiarity = "high"
sections = ["Hero", "Features", "Cta", "Footer", "Gallery"]
theme_system = "css-variables-hsl"
validation_commands = ["npm install", "npm run build"]

