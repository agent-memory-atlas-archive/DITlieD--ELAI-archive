# Source tier classification config for Oracle research pipeline.
# T1 = authoritative primary sources. T2 = strong community sources.
# T3 = implicit default (anything not matched). T4 = blocklisted.

[tier1]
domains = [
    "doc.rust-lang.org",
    "docs.python.org",
    "developer.mozilla.org",
    "www.w3.org",
    "tc39.es",
    "www.rfc-editor.org",
    "datatracker.ietf.org",
    "peps.python.org",
    "arxiv.org",
    "dl.acm.org",
    "ieeexplore.ieee.org",
    "www.nature.com",
    "www.science.org",
    "learn.microsoft.com",
    "docs.oracle.com",
    "docs.aws.amazon.com",
    "cloud.google.com",
    "pytorch.org",
    "huggingface.co",
    "docs.rs",
    "crates.io",
    "pypi.org",
    "nodejs.org",
    "go.dev",
    "cppreference.com",
    "man7.org",
    "www.kernel.org",
    "openai.com",
    "docs.anthropic.com",
    "pkg.go.dev",
    "dev.java",
    "docs.swift.org",
    "www.php.net",
    "ruby-doc.org",
    "docs.julialang.org",
    "docs.scala-lang.org",
    "doc.qt.io",
    "ecma-international.org",
    "unicode.org",
    "www.iso.org",
