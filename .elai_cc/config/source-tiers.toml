    "www.acm.org",
    "pubs.acs.org",
    "journals.plos.org",
    "pubmed.ncbi.nlm.nih.gov",
    "semantic-scholar.org",
    "www.springer.com",
    "link.springer.com",
    "www.elsevier.com",
    "www.sciencedirect.com",
    "platform.openai.com",
    "docs.github.com",
    "docs.docker.com",
    "kubernetes.io",
    "www.terraform.io",
    "docs.nginx.com",
    "www.postgresql.org",
    "dev.mysql.com",
    "redis.io",
    "www.sqlite.org",
    "www.elastic.co",
    "grafana.com",
    "prometheus.io",
    "reactjs.org",
    "vuejs.org",
    "angular.dev",
    "svelte.dev",
    "nextjs.org",
