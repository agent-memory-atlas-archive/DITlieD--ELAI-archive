domain = "quality"
tier = 2
severity = "WARN"
title = "Detect empty catch blocks"
predicate_json = '{"type":"grep_pattern","pattern":"Err\\(_\\)\\s*=>\\s*\\{\\s*\\}","scope":null,"context_lines":2}'
phase_mask = 4294967295

[[rules]]
