# Seed engineering rules for ELAI rule engine.
# Each [[rules]] entry maps to a Rule struct. predicate_json holds the
# Predicate enum serialized as JSON (parsed via from_json at load time).
# phase_mask bits: 0=PLANNING 1=FEASIBILITY 2=TESTING_FIRST 3=EXECUTING
#                  4=AUDITING 5=MEMORIZING 6=CONFIGURING (0xFFFFFFFF = all)
# Predicate serde: #[serde(tag = "type", rename_all = "snake_case")]
# GrepPattern -> "grep_pattern", AstPattern -> "ast_pattern", etc.

[[rules]]
rule_id = "ENG-001"
domain = "safety"
tier = 1
severity = "BLOCK"
title = "Block unwrap in production code"
predicate_json = '{"type":"grep_pattern","pattern":"\\.unwrap\\(\\)","scope":null,"context_lines":2}'
phase_mask = 4294967295

[[rules]]
rule_id = "ENG-002"
domain = "safety"
tier = 1
severity = "BLOCK"
title = "Block expect in production code"
predicate_json = '{"type":"grep_pattern","pattern":"\\.expect\\(","scope":null,"context_lines":2}'
phase_mask = 4294967295

[[rules]]
rule_id = "ENG-003"
domain = "safety"
tier = 1
severity = "BLOCK"
title = "Block panic macro in library code"
predicate_json = '{"type":"grep_pattern","pattern":"panic!\\(","scope":null,"context_lines":2}'
phase_mask = 4294967295

[[rules]]
rule_id = "ENG-004"
domain = "safety"
tier = 1
severity = "WARN"
title = "Detect todo macro usage"
predicate_json = '{"type":"grep_pattern","pattern":"todo!\\(","scope":null,"context_lines":1}'
phase_mask = 4294967295

[[rules]]
rule_id = "ENG-005"
domain = "safety"
tier = 1
severity = "WARN"
title = "Detect unimplemented macro usage"
predicate_json = '{"type":"grep_pattern","pattern":"unimplemented!\\(","scope":null,"context_lines":1}'
phase_mask = 4294967295

[[rules]]
rule_id = "ENG-006"
domain = "security"
tier = 1
severity = "BLOCK"
title = "Block hardcoded secrets patterns"
predicate_json = '{"type":"grep_pattern","pattern":"(password|secret|api_key)\\s*=\\s*\"[^\"]+\"","scope":null,"context_lines":1}'
phase_mask = 4294967295

[[rules]]
rule_id = "ENG-007"
domain = "quality"
tier = 2
severity = "WARN"
title = "Detect silent error discard"
predicate_json = '{"type":"grep_pattern","pattern":"let\\s+_\\s*=.*\\?|let\\s+_\\s*=.*\\.unwrap","scope":null,"context_lines":2}'
phase_mask = 4294967295

[[rules]]
rule_id = "ENG-008"
domain = "quality"
tier = 2
severity = "WARN"
title = "Detect empty catch blocks"
predicate_json = '{"type":"grep_pattern","pattern":"Err\\(_\\)\\s*=>\\s*\\{\\s*\\}","scope":null,"context_lines":2}'
phase_mask = 4294967295

[[rules]]
rule_id = "ENG-009"
domain = "performance"
tier = 2
severity = "WARN"
title = "Detect clone in hot loop"
predicate_json = '{"type":"grep_pattern","pattern":"\\.clone\\(\\)","scope":null,"context_lines":3}'
phase_mask = 8

[[rules]]
rule_id = "ENG-010"
domain = "safety"
tier = 1
severity = "BLOCK"
title = "Block raw std::time usage"
predicate_json = '{"type":"grep_pattern","pattern":"std::time::(Instant|SystemTime)","scope":null,"context_lines":1}'
phase_mask = 4294967295

[[rules]]
rule_id = "ENG-011"
domain = "quality"
tier = 2
severity = "WARN"
title = "Detect magic numbers in function bodies"
predicate_json = '{"type":"grep_pattern","pattern":"[^0-9a-zA-Z_](4096|8192|16384|32768|65536)[^0-9]","scope":null,"context_lines":1}'
phase_mask = 4294967295

[[rules]]
rule_id = "ENG-012"
domain = "safety"
tier = 1
severity = "WARN"
title = "Detect unsafe blocks"
predicate_json = '{"type":"grep_pattern","pattern":"unsafe\\s*\\{","scope":null,"context_lines":3}'
phase_mask = 4294967295

# ---------------------------------------------------------------------------
# 3F.8 post-tool completeness GREP rules (Tier 1, engineering, PostToolUse).
# Spec docs/specs/guide/steps/phase-3F.txt 3F.8 lines 309-313 names these three
# EXACTLY; they were absent from both data/rules/*.toml and the rules crate
# (base-phase-3 3F.crosswalk finding). Source: technical-analysis-v3.txt
# Concern 3 Mechanism 2, rules.txt section 8.6. These fire on tool RESULT text
# (web_fetch / file_read output), not on source files, so scope=null (both
# production+test). They are deterministic <1ms regex checks with no pre-exec
# I/O. phase_mask = all phases (PostToolUse runs regardless of FSM phase).
# Spec-name alias: the spec shorthand is "web_fetch with <img>" /
# "web_fetch with <table>" / "file_read with TODO/FIXME"; the titles below are
# the canonical long form of those exact three names.
# ---------------------------------------------------------------------------

[[rules]]
rule_id = "ENG-013"
domain = "engineering"
tier = 1
severity = "WARN"
title = "web_fetch with <img> — images present in fetched HTML not extracted"
predicate_json = '{"type":"grep_pattern","pattern":"<img\\b[^>]*>","scope":null,"context_lines":0}'
phase_mask = 4294967295

[[rules]]
rule_id = "ENG-014"
domain = "engineering"
tier = 1
severity = "WARN"
title = "web_fetch with <table> — tables present in fetched HTML not extracted"
predicate_json = '{"type":"grep_pattern","pattern":"<table\\b[^>]*>","scope":null,"context_lines":0}'
phase_mask = 4294967295

[[rules]]
rule_id = "ENG-015"
domain = "engineering"
tier = 1
severity = "INFO"
title = "file_read with TODO/FIXME — outstanding TODO/FIXME items in read file"
predicate_json = '{"type":"grep_pattern","pattern":"\\b(TODO|FIXME)\\b","scope":null,"context_lines":0}'
phase_mask = 4294967295
