# Seed engineering rules for ELAI rule engine.
# Each [[rules]] entry maps to a Rule struct. predicate_json holds the
# Predicate enum serialized as JSON (parsed via from_json at load time).
# phase_mask bits: 0=PLANNING 1=FEASIBILITY 2=TESTING_FIRST 3=EXECUTING
#                  4=AUDITING 5=MEMORIZING 6=CONFIGURING (0xFFFFFFFF = all)
# Predicate serde: #[serde(tag = "type", rename_all = "snake_case")]
# GrepPattern -> "grep_pattern", AstPattern -> "ast_pattern", etc.

[[rules]]
rule_id = "ENG-001"
domain = "safety"
tier = 1
severity = "BLOCK"
title = "Block unwrap in production code"
predicate_json = '{"type":"grep_pattern","pattern":"\\.unwrap\\(\\)","scope":null,"context_lines":2}'
phase_mask = 4294967295

[[rules]]
rule_id = "ENG-002"
domain = "safety"
tier = 1
severity = "BLOCK"
title = "Block expect in production code"
predicate_json = '{"type":"grep_pattern","pattern":"\\.expect\\(","scope":null,"context_lines":2}'
phase_mask = 4294967295

[[rules]]
rule_id = "ENG-003"
domain = "safety"
tier = 1
severity = "BLOCK"
title = "Block panic macro in library code"
predicate_json = '{"type":"grep_pattern","pattern":"panic!\\(","scope":null,"context_lines":2}'
