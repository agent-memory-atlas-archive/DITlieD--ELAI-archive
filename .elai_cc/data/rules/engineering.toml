[[rules]]
rule_id = "ENG-006"
domain = "security"
tier = 1
severity = "BLOCK"
title = "Block hardcoded secrets patterns"
predicate_json = '{"type":"grep_pattern","pattern":"(password|secret|api_key)\\s*=\\s*\"[^\"]+\"","scope":null,"context_lines":1}'
phase_mask = 4294967295

[[rules]]
rule_id = "ENG-007"
domain = "quality"
tier = 2
severity = "WARN"
title = "Detect silent error discard"
predicate_json = '{"type":"grep_pattern","pattern":"let\\s+_\\s*=.*\\?|let\\s+_\\s*=.*\\.unwrap","scope":null,"context_lines":2}'
phase_mask = 4294967295

[[rules]]
