# phase-3J-BASELINE fixture: json_schema constrained-decoding gate.
# Exactly 20 prompts, all flagged expect-json (see below). Targets the sidecar
# response_format={"type":"json_schema","json_schema":{"schema": ...}}
# path wired at server.py:1828-1898 (_build_constrained_prefix_fn — LMFE).
# Acceptance gate G4: 0 invalid-JSON outputs required.
#
# DEFERRED: grammar/EBNF coverage. Sidecar handler rejects any
# response_format.type other than "json_schema" (server.py:1865-1873) so the
# baseline harness exercises JSON-schema mode only. Grammar mode is the
# subject of a follow-on phase once the sidecar grows an EBNF branch.

[fixture]
tier = "json_schema"
default_max_tokens = 96
default_temperature = 0.0

[[fixture.prompts]]
id = "js01_name_age"
text = "Return ONLY a JSON object: {name, age}. Pick any plausible values."
expect_json = true
schema = '''{"type":"object","properties":{"name":{"type":"string"},"age":{"type":"integer"}},"required":["name","age"]}'''

