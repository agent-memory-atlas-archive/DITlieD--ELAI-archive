# D-9 — L3 frozen-surface access-control registry (canonical).
#
# Loaded by `elai_orchestrator::LockedKeysRegistry::load` from
# `.elai_cc/scripts/locked_keys_registry.toml`. Each `[[locked_keys]]`
# table entry declares a surface the agent MUST NOT modify without an
# explicit human override (L3_OVERRIDE convention — separate plan).
#
# Grounding sources (per CLAUDE.md grounded-by-default rule):
#   * docs/thefinalglance/D-plan/D-9_l3_frozen_surfaces.md
#   * docs/specs/guide/reasoning-improvement-grounded-2026-05-19.md
#     section 2.3 + section 4 (L3 expansion).
#   * arxiv:1908.04734 (Everitt current-RF principle, T1).
#   * arxiv:1906.01820 (Hubinger mesa-optimization, T1).
#
# Bootstrap-seed policy: this registry SHIPS EMPTY (no live entries) so
# the D-9 orchestrate run itself cannot trip the hook on its own
# commits. Real surface population happens in a follow-up patch once
# the L3_OVERRIDE convention is documented + reviewed (D-9 plan task 7).
#
# Schema (every field optional except `path` + `reason`):
#   path                  workspace-relative posix path; the auditor
#                         normalises Windows backslashes before match.
#   line_range            inclusive [start, end] line range; omit or
#                         use [0, 4294967295] for whole-file locks.
#   reason                human-readable explanation surfaced in
#                         pre-commit hook error output.
#   owner_session         session id that registered the lock (empty
#                         string for bootstrap seeds).
#   freeze_ts_ms          UNIX ms of registration (0 for bootstrap).
#   signature_blake3      blake3 hex of the canonical pre-image
#                         `path|line_range|reason|owner_session|freeze_ts_ms`.
#                         Empty string is permitted on bootstrap rows;
#                         the auditor recomputes on every audit run.
#
# ---------------------------------------------------------------------------
# Example entries (commented out — uncomment + edit when populating).
# ---------------------------------------------------------------------------
#
# [[locked_keys]]
# path = "crates/orchestrator/src/tripwire.rs"
# line_range = [0, 4294967295]
# reason = "tripwire detection code per companion section 4 (D-4); arxiv:1908.04734 current-RF principle"
# owner_session = "bootstrap-seed"
# freeze_ts_ms = 0
# signature_blake3 = ""
#
# [[locked_keys]]
# path = "crates/orchestrator/src/bai.rs"
# line_range = [0, 4294967295]
# reason = "BAI scoring function per companion section 4 (D-5)"
# owner_session = "bootstrap-seed"
# freeze_ts_ms = 0
# signature_blake3 = ""
#
# [[locked_keys]]
# path = "crates/orchestrator/src/canary.rs"
# line_range = [0, 4294967295]
# reason = "cross-domain canary task family definitions per companion section 4 (D-7)"
# owner_session = "bootstrap-seed"
# freeze_ts_ms = 0
# signature_blake3 = ""
#
# [[locked_keys]]
# path = "crates/orchestrator/src/held_out.rs"
# line_range = [0, 4294967295]
# reason = "held-out task selection algorithm per companion section 4 (D-6)"
# owner_session = "bootstrap-seed"
# freeze_ts_ms = 0
# signature_blake3 = ""

# (Bootstrap row left commented so the registry parses to zero entries.
# `LockedKeysAuditor` interprets an empty registry as "no surfaces
# locked" and always allows; the audit-run SSB row is still emitted so
# dashboard consumers can see the auditor ran.)
#
# D-10 — mode-routing predicate L3 locks (LIVE).
#
# These are the first non-empty entries in the bootstrap registry. The
# D-9 bootstrap policy (see header) keeps the registry empty by default
# so the D-9 orchestrate run itself cannot trip the hook on its own
# commits. D-10 is the legitimate first-mode use case: the mode-routing
# predicate IS the function the agent must never edit (Cohen Boxed
# Myopic + Everitt current-RF). D-10's own write is the bootstrap, and
# the D-10 integration test under crates/orchestrator/tests/ asserts
# that a synthetic edit to crates/orchestrator/src/grounding_mode.rs
# fires a LockedKeysViolationDetected row.
#
# Grounding: arxiv:1908.04734 (Everitt current-RF principle, T1) — the
# agent must not edit the routing logic that picks how its claims are
# graded; arxiv:1905.12186 (Cohen Boxed Myopic AI) — the optimiser must
# not influence its own grading function.

[[locked_keys]]
path = "crates/orchestrator/src/grounding_mode.rs"
line_range = [0, 4294967295]
reason = "select_grounding_mode + GroundingMode closed enum per D-10 §3.2; agent cannot alter routing logic (arxiv:1908.04734)"
owner_session = "d-10-closure"
freeze_ts_ms = 0
signature_blake3 = ""

[[locked_keys]]
path = "crates/orchestrator/src/claim.rs"
line_range = [0, 4294967295]
reason = "ClaimType + EvidenceKind closed enums per D-10 companion §4; agent cannot add new claim types"
owner_session = "d-10-closure"
freeze_ts_ms = 0
signature_blake3 = ""

