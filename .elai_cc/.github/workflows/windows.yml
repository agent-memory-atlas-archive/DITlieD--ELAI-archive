# B-15A Task 18 — Windows CI smoke
#
# Validates that the workspace compiles on windows-2022 and that the
# Windows-specific contract suites pass. Scoped (cargo check --workspace + a
# small set of -p targeted tests) — full-workspace test sweeps live in their
# dedicated workflow.
#
# Scope today: ensure hooks.rs sh-vs-cmd dispatch (B-15A Task 16) and the
# entropy / hashmap deterministic checks behave on a non-Unix runner.

name: windows-smoke

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-smoke:
    name: B-15A windows smoke
    runs-on: windows-2022

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-windows-smoke-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-windows-smoke-

      - name: Workspace cargo check
        working-directory: .elai_cc
        run: cargo check --workspace --locked

      - name: HashMap ban check
        working-directory: .elai_cc
        run: bash scripts/check_hashmap_ban.sh

      # Entropy quarantine is active as of C-15. Allowlist mechanism:
      #   - `// entropy-allow: <reason>` annotation on the SystemTime / Instant
      #     / Uuid line for sites that cannot route through ClockProvider /
      #     EntropySource (e.g., serde defaults, getrandom fallback seeds,
      #     non-injectable boundary code).
      #   - `// TEST_KEEP` for cfg(test) blocks inside src/ that the script
      #     cannot exclude by directory.
      #   - Canonical modules (clock.rs, entropy.rs) and tests/ directories
      #     are excluded by the script.
      - name: Entropy quarantine check
        working-directory: .elai_cc
        run: bash scripts/check_entropy_quarantine.sh

      # C-21 Task 1 — anti-staleness lint. STRICT mode (exit 1 on violation).
      # Checks for Box<dyn Error>, `use log::`, ort = "-rc", etc. Per
      # CLAUDE.md "Anti-Stale-Training" hard rule.
      - name: Anti-stale lint
        working-directory: .elai_cc
        run: bash scripts/check_anti_stale.sh

      - name: Hooks Windows compat contract test
        working-directory: .elai_cc
        run: cargo test -p elai-orchestrator --test hooks_windows_compat --locked

      # C-27 Testing-Trust Tier T-0 — deterministic wiring contract audit.
      # Compiles the elai CLI in release mode and invokes
      # `elai wiring audit` over the workflow-root plan markdown directories
      # (`docs/thefinalglance/B-plan` + `C-plan` + `D-plan`). Exit code is
      # 0 on a clean audit (zero WiringViolation rows) and 1 on any
      # violation.
      #
      # BLOCK-1 follow-up (C-27 patch): the default forbidden patterns
      # were tightened — bare-word `\bstub\b` / `\bdeferred\b` were
      # producing 930 false positives against the live tree. Defaults now
      # match only (a) bare-statement `todo!()` / `unimplemented!()` /
      # `panic!("not yet ...")` and (b) comment-leading `// STUB:` /
      # `// TODO:` / `// FIXME:` markers. Lines tagged with the
      # `stub-ban-allow:` opt-out token are exempt (mirrors C-15
      # `entropy-allow:`).
      #
      # BLOCK-2 follow-up: contracts dir now points at
      # `../docs/thefinalglance` (the workflow-root plan tree); the
      # previous `crates/orchestrator/tests` default scanned a Rust test
      # directory with zero `*.md` files, so DkgReachability +
      # ObservableEffect auditors no-opped.
      #
      # Skip set: `/tests/`, `/target/`, `/node_modules/`,
      # `/__pycache__/`, `/.bkp_old/`, `/.elai/`, `/benches/`,
      # `/examples/`, `/.venv/`, `/.venv-staging/`, `/site-packages/`,
      # `/dist-info/`, `/.tox/`, `_test.rs`, `_contract.rs`.
      #
      # R3 (wiring-enforcement): the wiring audit is a gate; it must NOT carry
      # an opt-out. The `[ci skip]` guard was removed so a commit message can no
      # longer bypass the audit on the Windows leg. The canonical cross-platform
      # invoker is .github/workflows/wiring-audit.yml (ubuntu-latest).
      - name: Wiring contract audit (C-27 T-0)
        working-directory: .elai_cc
        run: |
          cargo build -p elai-cli --release --locked
          ./target/release/elai wiring audit \
            --config elai_cc.toml \
            --contracts ../docs/thefinalglance
