# B-28 E-6: per-ecosystem allowlist consumed by
# `elai_orchestrator::focus_tunnel::dep_resolver::DependencyResolver`.
# A name listed here SKIPS the registry probe and is auto-approved by the
# resolver (operator has pre-vouched). Anti-stale waiver: `ort` is ALWAYS
# blocked even if allowlisted — see
# `workflow/reasoning/B-16A-decisions.md`. Empty buckets are legal.
# Loaded by `dep_resolver::load_allowlist`; absence is non-error.
[dependencies.allowlist]
cargo = ["tokio", "serde"]
pip = ["fastapi"]
npm = []
go = []

# B-27: cloud-mode routing + spend caps + privacy profile + air-gapped flag.
# Consumed by elai_orchestrator::cloud_mode::CloudModeRouter via
# CloudConfigToml::to_cloud_config(). Missing fields fall back to the
# defaults declared in cli/runtime_config.rs::CloudConfigToml::default().
[cloud]
default_provider = "anthropic"
default_model = "claude-sonnet-4-6"
# default_mode: "local" | "cloud" | "auto" (typo falls back to "auto").
default_mode = "auto"
# air_gapped=true causes ExecMode::Cloud to short-circuit with
# CloudModeError::AirGappedConflict before any network call.
air_gapped = false

[cloud.privacy]
# profile: "minimal" | "standard" | "strict" (typo falls back to "standard").
# standard scrubs email, IPv4, and Anthropic/OpenAI/GitHub-style tokens.
# strict adds Windows + POSIX absolute paths.
profile = "standard"

[cloud.spend]
# warn_at_usd is informational only (dashboard surface). hard_cap_daily_usd
# and hard_cap_monthly_usd are enforced by CloudModeRouter::route when set.
warn_at_usd = 1.0
# hard_cap_daily_usd = 5.0
# hard_cap_monthly_usd = 50.0

# ============================================================================
# B-40: Domain Research Presets
# ============================================================================
# Each preset is keyed by the snake_case ProjectClass discriminant
# (consumer_mobile_app / web_app / saas_dashboard / desktop_app / game_mod /
#  research_tool / library_or_sdk / cli_tool / other).
#
# Loaded by elai_orchestrator::idea_framing::ResearchPresets at startup;
# dispatched as a multi-root FlashResearch tree by frame_idea() during the
# FRAMING substate. Each stream becomes one root node in the tree.
#
# Mandatory streams MUST converge OR be reported in `degraded_streams`.
# Non-mandatory streams are best-effort.
#
# Spec ref: docs/thefinalglance/B-plan/B-40_idea_framer_research_presets.md
# Decision doc: workflow/reasoning/B-40-decisions.md
# ============================================================================

[research_presets]

