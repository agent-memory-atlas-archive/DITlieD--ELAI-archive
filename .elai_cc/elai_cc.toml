# C-30 (4D.15): per-VRAM-tier research pipeline configuration. Mirrors the
# `ResearchTierConfig` struct in
# `crates/orchestrator/src/research_tier.rs` (model, quant, context_ceiling,
# research_context_budget, chunk_size, breadth_factor, depth_limit, phi_min,
# psi_min, embedding_device, max_sources_per_node, max_concurrent_fetches,
# speculative_depth). Presence-only for now — `research_config_for_tier` is
# the runtime source of truth; a future loader can read this section to
# override the hardcoded tier configs without code changes.
# DETERMINISTIC_CHECK passes when >=5 entries are present.
[research.vram_tiers.vram_8gb]
model = "Qwen2.5-Coder-3B"
quant = "NF4"
context_ceiling = 16384
research_context_budget = 12000
chunk_size = 300
