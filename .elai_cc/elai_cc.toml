# D-1: ReasoningTemplate archive lifecycle configuration. Commented out by
# default — runtime_config.rs falls back to these defaults if the section is
# absent (archive_path = ".elai_cc/archive/reasoning-templates.jsonl",
# bounded_string_max = 1024).
# [reasoning.templates]
# archive_path = ".elai_cc/archive/reasoning-templates.jsonl"
# bounded_string_max = 1024

# ============================================================================
# D-2: PPM (Process Preference Model) sidecar configuration.
# ============================================================================
# Heterogeneous verifier substrate per rStar-Math (arxiv:2501.04519, T1) §3.2.
# The PPM lives on a SEPARATE port (8101) from the policy SLM sidecar (8100)
# and runs a different model family (Qwen2.5-Math-PRM-7B) so the verifier
# decision is not coupled to the policy SLM's blind-spots
# (arxiv:2504.16760, T1 heterogeneous-verifier requirement).
#
# Opt-in via ELAI_PPM_ENABLE=1 + this section uncommented. Without both,
# the PPM is never contacted and the consensus path (D-3) falls back to
# the existing pre-promotion chain gate.
#
# Spec ref: docs/thefinalglance/D-plan/D-2_ppm_sidecar_wiring.md
# Decision doc: workflow/reasoning/D-2-decisions.md
# ============================================================================
[runtime.ppm]
endpoint = "http://127.0.0.1:8101/v1/ppm/score"
timeout_secs = 30
max_retries = 3
model = "huihui-ai/Qwen2.5-Math-PRM-7B"
min_score_threshold = 0.7

# ============================================================================
# C-44: Cursor Composer 2 paid HTTP backend (Phase 4M extension).
# ============================================================================
# Composer 2 is Cursor Research's domain-specialised coding model.
# Paper grounding arXiv:2603.24477 covers ONLY the model's training
# methodology + headline benchmarks; integration design (endpoint, auth,
# pricing, request shape) is source-grounded via @cursor/sdk +
# cursor.com/docs/api. See workflow/papers/composer2-interface.md for the
# shallow-cite-fit analysis.
#
# Cost positioning (cursor.com pricing page, verified 2026-05-24):
#   - $0.50 / 1M input tokens   (500 micros / 1k input)
#   - $2.50 / 1M output tokens  (2500 micros / 1k output)
#
# Tier semantics: ELAI does NOT introduce a BackendTier enum. "Tier" emerges
# from cost-per-token relative ranking between local (Sidecar = free),
# middle (Composer 2 = $0.50/$2.50 per Mtok), and premium (AnthropicApi
# = Sonnet 4.6 cloud) — no first-class abstraction.
#
# Default routing: KEEP Executor -> Sidecar (free local). composer2 is
# OPT-IN per project. Flip `enabled = true` AND set CURSOR_API_KEY in the
# environment to activate. Without both, the adapter's health_check returns
# Unavailable and the orchestrator never routes to it.
#
# Spec ref: docs/thefinalglance/C-plan/C-44_composer2_runtime_backend_tier.md
# Decision doc: workflow/reasoning/C-44-decisions.md
# ============================================================================
# [runtime.composer2]
# enabled = false
# api_key_env = "CURSOR_API_KEY"
# model = "composer-2"
# fallback_to = "sidecar"

# ============================================================================
# D-5: BAI (Best-Arm Identification) Thompson-promotion round.
# ============================================================================
# The post-consensus hook in task_runner::dispatch_bai_round folds each
# verifier-consensus verdict into the candidate template's Beta(alpha, beta)
# posterior, runs one Thompson sample across all known arms, and (when the
# posterior mean clears `promotion_threshold` AND the Thompson sample picks
# the candidate) flips the archive entry's status from Candidate to Promoted.
#
# Opt-in via ELAI_BAI_ENABLE=1 + this section uncommented. Without both, the
# BAI runtime is never constructed and the BAI row family
# (`thompson_sampled` / `bai_arm_updated` / `template_promoted` /
# `template_candidate_rejected`) stays dark. The fields below are L3-locked
# (operator-tunable but spec-checked) per the per_level audit cascade.
#
# Defaults (also the in-code defaults — section is OPTIONAL):
#   alpha_prior = 1.0           Beta(1,1) uniform prior on fresh arms
#   beta_prior = 1.0
#   confidence_level = 0.95     used by credible_interval() diagnostics
#   promotion_threshold = 0.55  Companion-spec §3.7 (0.5 baseline + 0.05 delta)
#
# Spec ref: docs/thefinalglance/D-plan/D-5_bai_thompson_promotion.md
# Grounding: Audibert/Bubeck/Munos COLT 2010 (Successive Rejects);
# arXiv:2106.10417 (variance-dependent BAI). Decision doc:
# workflow/reasoning/D-5-decisions.md.
# ============================================================================
[bai]
alpha_prior = 1.0
beta_prior = 1.0
confidence_level = 0.95
promotion_threshold = 0.55

# ============================================================================
# D-17: Honest-refusal SLA monitoring.
# ============================================================================
# Sliding-window monitor over the D-16 `RefusalDecision` stream. Counts the
# fraction of `Abstain` decisions inside `window_size` recent decisions and
# classifies the rate against the healthy band `[healthy_band_lo,
# healthy_band_hi]`. Emits one `refusal_rate_snapshot` SSB row per snapshot
# and one `refusal_sla_breach` SSB row whenever the rate leaves the band.
#
# Defaults (also the in-code defaults — section is OPTIONAL):
#   window_size = 100
#   target_rate = 0.10
#   healthy_band_lo = 0.05
#   healthy_band_hi = 0.20
#   alarm_threshold_breaches = 3
#
# Spec ref: docs/thefinalglance/D-plan/D-17_honest_refusal_sla.md
# Grounding: arXiv:2503.01345 (UniCR honest refusal); docs/specs/guide/
# real-problem-solving-grounded-2026-05-19.md §4.6 (refusal rate as a
# first-class quality metric).
# ============================================================================
# [refusal_sla]
# window_size = 100
# target_rate = 0.10
# healthy_band_lo = 0.05
# healthy_band_hi = 0.20
# alarm_threshold_breaches = 3
# verifier_id = "ppm_qwen25_math_prm_7b"

# ============================================================================
# D-13: Adversary role + cross-family verifier (FalsifiabilityCrossFamily mode).
# ============================================================================
# The post-task hook in task_runner::dispatch_adversarial_pass routes per-task
# claims through agent_pool::run_adversarial_pass when both the runtime state
# is plumbed AND `ELAI_ADVERSARY_ENABLE=1` is set. The producer emits one
# `adversary_generated` SSB row + one `consensus_reevaluated_with_counter` SSB
# row per pass, joined by `claim_id`.
#
# Hard constraints (per the spec):
# - Adversary MUST emit from a model family DIFFERENT than the worker
#   (heterogeneous-verifier per arxiv:2504.16760 T1). The
#   `min_family_distance` knob locks this at the runtime layer:
#   `1` (default) refuses same-family pairs; `0` disables the guard
#   (NOT recommended — same-family adversarial probing has a 64.5%
#   blind-spot rate per arxiv:2507.02778 T1 Self-Correction Bench).
# - When the configured adversary's family equals the worker's family the
#   dispatch is silently skipped (debug trace only). The
#   `HeterogeneousVerifierMissing` warning from `run_adversarial_pass`
#   covers the heterogeneous-pool gap; we do NOT emit a separate
#   "cross-family unavailable" SSB variant (consolidated-SSB-variant
#   precedent — D-9/D-10/D-11/D-12; consensus pass conveys the gap via
#   verdict-inversion on the already-shipped row pair).
#
# Opt-in via ELAI_ADVERSARY_ENABLE=1 + this section uncommented + an
# adversary adapter plumbed through TaskRunnerConfig.adversary_runtime
# (typically a cloud Sonnet HTTP adapter — sonnet is cross-family from the
# default local Qwen2.5-Coder-7B worker). Without all three the row pair
# stays dark.
#
# L3-LOCKED per the per_level audit cascade (operator-tunable but
# spec-checked). The fields below are documented defaults; uncomment to
# override.
#
# Spec ref: docs/thefinalglance/D-plan/D-13_adversary_role_cross_family.md
# Grounding:
#   - arxiv:2504.16760 (T1) Lightweight Latent Verifiers — heterogeneous
#     verification is the documented defense; same-family verifier
#     transfer fails.
#   - arxiv:2507.02778 (T1) Self-Correction Bench — same-model
#     self-critique 64.5% blind-spot rate.
#   - arxiv:2504.04918 (T1) Constitution or Collapse — 8B same-family
#     recursive self-critique causes MODEL COLLAPSE; cross-family GPT-4o
#     critic breaks the loop.
#   - arxiv:2503.17365 (T1) Constitutional AI in Small LLMs — 4-outcome
#     taxonomy used in the adversary agent's self_assessment field.
# Decision doc: workflow/reasoning/D-13-decisions.md.
# ============================================================================
# [adversary]
# enable = false                         # also gated on ELAI_ADVERSARY_ENABLE=1
# min_family_distance = 1                # 0 disables same-family guard (NOT recommended)
# max_disagreement_score_delta = 0.3     # severity floor for invalidating counters
# preferred_cross_family_pairs = [       # empty = any cross-family pair allowed
#   ["local", "anthropic"],
#   ["local", "openai"],
# ]

[tool_gating]
enabled = true
gate_manifest_path = "plugins/tool-gate.toml"
lazy_schema_default = true
max_eager_schemas = 4

# ============================================================================
# C-47: Case-Based Calibration of Tool-Use (CAST framework, arXiv:2605.15041).
# ============================================================================
# Per-tool telemetry layer that records (call, response, post_call_audit) and
# emits corrective hints when an error-rate threshold is crossed. The
# orchestrator's bootstrap reads this section once at startup and constructs
# an `Arc<ToolCalibrationRegistry>` that is then attached to DefaultMcpBridge
# via `with_calibration_registry`. When `enabled = false` the registry stays
# None and both dispatchers stay back-compat (no consult, no record, no SSB
# rows). The plugins-side default IS false — operators opt in.
#
# Paper grounding:
#   - arXiv:2605.15041 (CAST — Case-Based Calibration of Adaptive Reasoning
#     and Execution for LLM Tool Use, Pang/Lan/Liu/Tong/Cao/Zhang 2026).
#     See workflow/papers/case-based-calibration.md.
#   - The CAST framework aggregates signals ACROSS the case base (per-(tool,
#     call_shape_hash) aggregation) NOT per-query nearest-neighbor lookup.
#   - The 5-dim failure profile (name, key, type, constraint, value) is a
#     paper invariant; the 6th dimension (exact-match) is in R_tool reward
#     only, NOT in the telemetry tuple.
# ============================================================================
[tool_use.case_base]
# Master enable for the calibration layer. When false, the registry stays
# None and both dispatchers run the C-35 / C-42 stack untouched. Defaults to
# false (wire-dark per the D-10 / D-11 / B-37 quadruple-precedent for new
# behavioural changes).
enabled = false
# Per-tool LRU capacity (least-recently-used eviction; deterministic). Above
# this floor the LRU evicts the least-recently-USED shape. The contract test
# `c47_case_based_calibration_contract::g4_lru_cap_100_evicts_deterministically`
# fences this value at 100; changing it requires a contract-test update.
lru_cap = 100
# When true, `ToolCalibrationRegistry::consult` returns `None` regardless of
# the underlying case state. Useful for operators to disable hint emission
# without disabling the whole calibration layer. stub_ban (HARD): the
# suppression is gated AT THE EMIT POINT (see contract test G6).
hint_suppression = false
# Minimum total_calls per (tool, shape) before the hinter trusts the error
# rate. Below this floor no hint fires. The hinter constant
# `HINT_MIN_TOTAL_CALLS` mirrors this default.
min_total_calls = 5
# Error-rate threshold beyond which a corrective hint fires. The hinter
# constant `HINT_ERROR_RATE_THRESHOLD` mirrors this default.
error_rate_threshold = 0.30

# ============================================================================
# E-15: Sandbox hardening -- Firecracker + gVisor + AppContainer + researcher net
# ============================================================================

[sandbox.firecracker]
enabled = true
snapshot_dir = ".elai_cc/sessions/{session_id}/snapshots"
restore_budget_ms = 200
max_snapshots = 64
max_age_secs = 86400
uniqueness_mitigation = true

[sandbox.gvisor]
# gVisor syscall overhead ~10-20% vs Firecracker 1-2% (gvisor.dev + HotCloud19).
enabled_if_no_kvm = true
platform = "systrap"

[sandbox.appcontainer]
# Windows AppContainer (Chromium-hardened, job object + restricted token).
job_kill_on_close = true
active_process_limit = 1
low_il_descriptor = true

[researcher.net]
# Researcher-role network egress allowlist.
# FQDNs resolved at spawn time; IPs pinned into iptables OUTPUT chain.
# reject_not_drop: fast EHOSTUNREACH vs silent 30s timeout (shayon.dev 2026).
allowed_hosts = ["arxiv.org", "huggingface.co"]
trusted_resolvers = ["1.1.1.1", "8.8.8.8"]
reject_not_drop = true

# ============================================================================
# E-17 SP2 — knowledge / RAG retrieval-quality config keys.
# ============================================================================
# All keys below are commented schema documentation; the knowledge crate
# currently hardcodes the defaults (see crates/knowledge/src/deep.rs,
# pipeline.rs, hyde.rs). Real TOML loading lands in E-17 ops follow-up.

[knowledge.reranker]
# Cross-encoder reranker model selector.
# Valid values:
#   "ms-marco-minilm-l12"  (default — staged at models/onnx/cross-encoder-l12.onnx)
#   "jina-rerank-v3"        (jinaai/jina-reranker-v3; model file NOT staged yet)
#   "bge-reranker-v2-m3"    (BAAI/bge-reranker-v2-m3; model file NOT staged yet)
# Selecting an unstaged variant triggers a tracing::warn and the pipeline
# degrades to unranked (no panic).
# model = "ms-marco-minilm-l12"

[knowledge.deep]
# DEEP-tier candidate pool cap applied BEFORE the RRF accumulator.
# Prior-work-typical heuristic per arxiv:2411.11767 S4 fn1 (paper does NOT
# mandate this specific value; avoids phantom-hit zone observed at K=5000).
# max_candidates = 100
#
# RRF quality gate floor applied AFTER the freshness multiplier.
# ELAI design choice (back-derived from k=60 arithmetic: a single ranker at
# rank 140 produces score 1/(60+140)=0.005). Validated by SP6 eval harness.
# rrf_floor = 0.005

[knowledge.rrf]
# Per-ranker RRF fusion weights. Defaults match the spec values
# `{bm25 = 1.0, code_vec = 1.0, text_vec = 0.8}`. Emitted on the
# `rrf_component_weights` SSB beacon per query.
# weights = {bm25 = 1.0, code_vec = 1.0, text_vec = 0.8}

[knowledge.hyde]
# NL-only HyDE gate (E-17 SP2 task 5). When true, HyDE only fires on
# queries classified as NaturalLanguage by knowledge::query_class::classify.
# CodeSymbol / Mixed queries skip HyDE and emit a `hyde_skipped_code_query`
# SSB beacon. Override at runtime via ELAI_HYDE_NL_ONLY=0.
# Honest framing: extrapolation from arxiv:2212.10496 NL-focus design intent;
# NOT externally validated for code queries (SP6 measures recall@5).
# nl_only = true

[knowledge.code_vec]
# Secondary code-space vector index gate. When true the GraphCodeBERT
# code index is loaded at startup and contributes to RRF fusion alongside
# BM25 + text_vector. Equivalent to setting ELAI_CODE_VEC=1.
# enabled = false

[knowledge.late_interaction]
# E-17 SP7 (task 8) — PLAID / FastPlaid late-interaction retriever flag.
# DEFERRED-DEFAULT-OFF per plan §Open questions. When true (future
# E-17.B), a late-interaction ranker contributes as an 8th retriever
# alongside BM25 + code_vec + text_vec + rerank.
#
# Implementation note: integrating PLAID requires either:
#   (a) the next-plaid Rust crate (anti-slopsquatting: NOT verified on
#       crates.io as of 2026-05-23, do NOT add to Cargo.toml without
#       registry verification), or
#   (b) the FastPlaid Rust+CUDA path from github.com/lightonai/fast-plaid
#       (production target).
#
# This flag exists today as a config surface so contracts and downstream
# config-loading code can compile against a stable key path; the producer
# wiring lands in E-17.B follow-up. Until then the value is ignored.
# enabled = false

