# elai_cc configuration
# All sections are optional — defaults are used when absent.
# This file is read once at startup by load_elai_config() in crates/cli/src/runtime_config.rs.

[tools.routing_rules]
# enabled = true
# allow_override_prefix = "!"

[tools.safety_filter]
# enabled = true

[output]
# strip_emoji = true
# strip_sycophancy = true
# max_response_tokens = 0  # 0 = no truncation

[actions]
# mode = "Interactive"  # "Interactive" | "Autonomous"

[inference]
# During-generation feature safety defaults (A-39).
# All features ship DISABLED until calibration/testing confirms they help.

# Steering vector (ActAdd) — measured NEUTRAL on Qwen2.5-Coder-7B (A-8 baseline).
# Enable only after domain-specific contrast pair testing shows measurable improvement.
steering_enabled = false

# ETC entropy threshold — UNCALIBRATED.
# Run metrics/calibrate_etc_threshold.py to compute a calibrated value.
# Until calibrated, server.py uses float("inf") which disables ETC entirely.
# etc_threshold = <run calibration to populate>

# DoLa + ETC incompatibility guard (server.py L1182-1190).
# DoLa is HARMFUL on models <32B (-15% code quality, -6% factuality, 4.7x slower).
# Guard auto-disables DoLa when ETC is active on models with <64 layers.
dola_on_32b_only = true

# Calibration target model — thresholds are architecture-specific.
# Do not apply calibrated values across different model families.
calibration_target_model = "Qwen2.5-Coder-7B"

[agents.auditor]
# deterministic_first: run Build/VersionGate/FileSizeCensus/LazyCode/Completeness checks
# before LLM auditor. Default: true. Set false only for rapid iteration debugging.
deterministic_first = true

# ============================================================================
# C-46: Uno-Orchestra parsimonious agent routing (selective delegation).
# ============================================================================
# Loaded by the routing module's RoutingPolicyToml::to_policy() into
# crates/orchestrator/src/routing/policy.rs::RoutingPolicy. Paper-grounded
# against arXiv:2605.05007 (Cui et al 2026, Sections 5 + 6.1 — (model,
# primitive) action space, alpha in [0,1] convex blend, S_max <= 0.10
# cost-hack bound, direct-answer lazy-mode cost zero). Paper interface:
# workflow/papers/uno-orchestra-interface.md.
#
# All keys are OPTIONAL — the section can stay commented out and the
# loader falls back to RoutingPolicyToml::default() which mirrors the
# in-code defaults (enabled=false, alpha=0.1, s_max=0.10, max_turns=8,
# max_workers_per_query=8).
#
# enabled: master gate. When false (default), the SelectiveDelegator
# path is fully inert and callers fall back to the baseline always-
# spawn chain. Mirrors the [agent.credit_attribution].enabled
# OFF-by-default precedent.
#
# alpha: cost-correctness blend in [0, 1] (paper Section 5; default
# 0.1 keeps the verifier reward dominant). Construction rejects values
# outside [0, 1].
#
# s_max: routing-shaping bonus cap in [0, 0.10] (paper Section 5;
# raising above 0.10 unlocks the cost-hacking failure mode the paper
# explicitly calls out). Construction rejects values exceeding 0.10.
#
# max_turns: T_max per trajectory (paper Section 5; default 8).
#
# max_workers_per_query: dispatch cap. Default 8 matches the C-45
# pilot scope (8 base AgentRole variants); raise only after the live
# Uno-Orchestra pilot runs.
# ============================================================================
[agent.selective_delegation]
enabled = false
alpha = 0.1
s_max = 0.10
max_turns = 8
max_workers_per_query = 8

# ============================================================================
# C-27: Testing-Trust Tier T-0 — Wiring Contract closed entrypoint set.
# ============================================================================
# The `elai wiring audit` subcommand reads [wiring.entrypoints].symbols and
# uses each entry as a BFS root for the DkgReachabilityAuditor. Each declared
# `produces_symbol` in a B-N / C-N WIRING_CONTRACT block must be reachable
# from at least one configured entrypoint, otherwise a
# WiringViolation(UnreachableSymbol) row is emitted to SSB and the CLI exits 1.
#
# Section absence is NON-FATAL (loader returns an empty WiringEntrypointSet
# plus tracing::warn!) — uncomment + populate when the project is ready to
# enforce strict reachability.
#
# Spec ref: docs/thefinalglance/C-plan/C-27_testing_trust_t0_wiring_contract.md
# Decision doc: workflow/reasoning/C-27-decisions.md (DECISION-NAMING /
# DECISION-D5).
# ============================================================================

[wiring.entrypoints]
# Real production entrypoint roots for the DkgReachabilityAuditor BFS. The
# reachability matcher reduces each entry to its TRAILING symbol name (the
# segment after the last "::") via entrypoint_match_key / symbol_trailing_name
# (wiring_contract.rs:1146-1175) and matches it against SymbolNode.name
# (symbol_graph::cache.rs:62 — the bare leaf function name from the mapper).
# Format is "<repo-relative-path>::<leaf-symbol>"; the path prefix is
# documentary (only the leaf after "::" is load-bearing for resolution) and is
# kept exact so each entry points at a real DEF site (all six verified against
# source). Covers the four production dispatch surfaces (CLI dispatch, FSM
# transitions, IPC handler, in-process tool dispatch) plus the dashboard/Tauri
# process entry + command-registration site.
symbols = [
    # CLI dispatch root (process entry -> run() -> per-subcommand dispatch).
    # main.rs:373 fn main(); leaf = "main".
    "crates/cli/src/main.rs::main",
    # FSM transition dispatcher (trait-dispatch over evidence gates).
    # fsm.rs:878 pub async fn transition(); leaf = "transition".
    "crates/orchestrator/src/fsm.rs::transition",
    # IPC tool-registry dispatch (async string-keyed handler dispatch).
    # ipc_registry.rs:94 pub async fn dispatch(); leaf = "dispatch".
    "crates/tools/src/ipc_registry.rs::dispatch",
    # In-process tool dispatch (Dispatch trait impl; dyn-dispatch site).
    # in_process.rs:102 fn dispatch_tool(); leaf = "dispatch_tool".
    "crates/orchestrator/src/dispatch/in_process.rs::dispatch_tool",
    # Dashboard/Tauri process entry. main.rs:3 fn main(); leaf = "main".
    "crates/dashboard-v2/src-tauri/src/main.rs::main",
    # Tauri command-registration site (generate_handler! invoke() surface).
    # lib.rs:368 pub fn run(); leaf = "run".
    "crates/dashboard-v2/src-tauri/src/lib.rs::run",
]

# ============================================================================
# D-FZ / WIRING-FIX-ELAI SP3 — Layer-3 instrumented-binary coverage runner.
# Consumed by the `elai wiring coverage` subcommand (SP3 build-new). The
# runner builds the instrumented binary (-C instrument-coverage), drives it
# under production-default env, parses cargo-llvm-cov --json output, and
# BLOCKs any NEW function whose hit count == 0 unless it is #[cfg(test)] or a
# registered WIRE-DARK[B-N] stub. fail_under_lines is a hard floor; a value
# the run can lower is itself frozen via locked_keys_registry.toml (D-FZ).
# Tooling pin (anti-slopsquat, verified live): cargo-llvm-cov v0.8.7
# (crates.io 2026-05-13); JSON flag is --json with --output-path, NOT
# --format=json (grounding wiring-elai-phase0:80,107).
# ============================================================================
[wiring.layer3]
enabled = true
fail_under_lines = 0.0
new_fn_zero_hit_is_block = true
instrument_profile = "coverage"
llvm_cov_json_flag = "--json"

# ============================================================================
# C-28: Testing-Trust Tier T-1 — Mutation testing gate config.
# ============================================================================
# Step 6 of `DeterministicAuditor::run_all` (runs only after Build /
# VersionGate / FileSizeCensus / LazyCode / Completeness all pass) consults
# `[testing.mutation]`. When `enabled = true` and at least one .rs / .py
# file is in the changed set, the RustMutationRunner / PythonMutationRunner
# shells out to cargo-mutants (Rust) / mutmut (Python) and computes
# `mutation_score_pct`. Score < `threshold_pct` produces a
# DeterministicFinding::Block which the AUDITING -> MEMORIZING transition
# rejects via FsmError::AuditingBlocked. One SsbActionType::MutationSurvived
# row is emitted per Survived mutant; Caught / Timeout / Skipped emit zero
# rows (stub_ban contract).
#
# cargo-mutants and mutmut are NOT Cargo dependencies — they are CLI tools
# that must be installed separately. See `scripts/install_dev_tools.sh`
# for the canonical install commands.
#
# Spec ref: docs/thefinalglance/C-plan/C-28_testing_trust_t1_mutation.md
# Decision doc: workflow/reasoning/C-28-decisions.md
# ============================================================================
[testing.mutation]
enabled = true
threshold_pct = 60.0
timeout_per_mutant_sec = 30
max_mutants_per_session = 100

# ============================================================================
# C-29: Testing-Trust Tiers T-2 (IntentPair) + T-3 (basic Metamorphic).
# ============================================================================
# [testing.intent]: PLANNING -> TESTING_FIRST gate enforces
# `IntentPairSet.len() >= min_pairs` per active BabyStep (default 3, per
# docs/specs/guide/testing-trust-design.txt L567 "require SSB action
# INTENT_CONFIRMED with at least 3 pairs per baby step"). Set
# `min_pairs = 0` to disable the gate entirely (dev ergonomics, not the
# default).
#
# [testing.metamorphic]: DeterministicAuditor Step 7 (post-Mutation)
# runs the relations listed in `relations`. Unknown names log a
# `tracing::warn!` and are skipped. `permutation_invariance` is OPT-IN
# (false positives on non-commutative ops, per spec L605-606).
# `sample_size` flows into `MrResult.sample_size` + the SSB `mr_violated`
# row when a relation fails.
#
# Spec ref: docs/thefinalglance/C-plan/C-29_testing_trust_t2_t3_intent_metamorphic.md
# Decision doc: workflow/reasoning/C-29-decisions.md
# ============================================================================
[testing.intent]
min_pairs = 3

[testing.metamorphic]
enabled = true
relations = ["identity", "inverse"]
sample_size = 100

# [testing.metamorphic.advanced_operators]: C-36 MuCoCo mutation-
# consistency catalog (arXiv:2604.19086). The 11 MuCoCo operators
# (MucocoOperator, metamorphic_testing.rs) are AST mutations dispatched
# to the python sidecar (/mucoco/mutate); a semantic-preserving mutation
# whose output diverges from the original is a behavioural inconsistency
# (latent bug), emitted as the MucocoInconsistencyDetected SSB row.
# Enum decision: MucocoOperator is CANONICAL; MetamorphicRelation is NOT
# extended (those are relations, these are mutations). WIRE-DARK[C-36]:
# default-OFF until the GPU-deferred sidecar pilot ships the detector.
# operators = [] means "all 11"; an explicit list scopes the run.
# sidecar_base_url is the /mucoco/mutate root; false_positive_audit_n is
# the sample size for the post-pilot false-positive audit.
[testing.metamorphic.advanced_operators]
enabled = false
operators = []
sidecar_base_url = "http://127.0.0.1:8100"
false_positive_audit_n = 50

