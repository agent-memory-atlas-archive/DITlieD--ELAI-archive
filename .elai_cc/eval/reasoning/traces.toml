# E-19 task 10 — 200-trace holdout for pre-L2 confidence-gate calibration.
#
# Each `[[trace]]` row carries:
#   - id: unique trace identifier (kebab-case)
#   - l1_candidate_distribution: list of f32 in [0.0, 1.0] (caller-normalized)
#   - l1_self_certainty: precomputed self-certainty score (top1 - top2 margin)
#   - failure_taxonomy_category: snake_case taxonomy slug
#   - retry_count: u32
#   - l2_needed: bool label (true = L2 reflection was needed / changed the
#     outcome; false = L1 candidate was already correct OR L3 was needed)
#   - source: SSB row prefix (provenance hint)
#
# RUNPOD-PENDING: the live 200-trace harvest runs against the remote sidecar
# (pythondev RTX 3090 24GB). Host-side scaffolding ships in this commit with
# 5 seed rows; the eval_cmd reasoning --harvest subcommand fills in the
# remaining 195 in a follow-up. The 5 seed rows below are HEURISTIC
# placeholders pulled from the activeContext.md trace fragments — they
# illustrate the schema but are NOT representative for threshold calibration.
# See workflow/reasoning/E-19-decisions.md DECISION-CALIBRATION.

schema_version = 1
total_expected = 200
seeded_rows = 5

[[trace]]
id = "trace-001"
l1_candidate_distribution = [0.95, 0.03, 0.01, 0.01]
l1_self_certainty = 0.92
failure_taxonomy_category = "missing_import"
retry_count = 0
l2_needed = false
source = "ssb_seq=42 baby_step=bs-001"

