# E-17 SP6 — RAG eval goldset (pragmatic 15-query seed)
#
# Each query is rendered against the ELAI repo at <project_root>/.elai_cc/.
# `expected_paths` are substring matches against either result.chunk_id or
# result.file_path. ANY of the listed substrings counts as a hit (OR-match).
# Tier is "both" (run on STANDARD and DEEP and compare) unless a specific
# tier is wanted.
#
# Class split (load-bearing for HyDE NL-only gate observation):
#   8 code/PL queries (exercise should_use_hyde -> false, emits
#                     hyde_skipped_code_query SSB row at DEEP tier)
#   7 nl queries     (HyDE attaches; DEEP query expansion fires too)
#
# Full 50-query goldset is deferred to ops follow-up. See README.md.

[meta]
corpus = "elai_cc-self"
goldset_version = "0.1.0"
created_ts = "2026-05-21"
total_queries = 15
class_balance = "8 code / 7 nl"
notes = "pragmatic 14-q seed from context-package + 1 added; full 50-q deferred to ops follow-up"

[[query]]
id = "code-01-runtime-adapter-stream-step"
text = "RuntimeAdapter::stream_step"
class = "code"
tier = "both"
enforced = true
# WARN-A fix (E-17 SP6 s-26556): RuntimeAdapter trait lives at
# providers/src/runtime/types.rs; stream_step is defined on ollama.rs +
# vllm.rs. There is NO crates/orchestrator/src/runtime_adapter.rs.
expected_paths = [
    "crates/providers/src/runtime/types.rs",
    "crates/providers/src/runtime/ollama.rs",
    "crates/providers/src/runtime/vllm.rs",
]

