# ---------------------------------------------------------------------------
# C-14 — slash-command taxonomy. Enumerates every variant of `SlashCommand`
# in `crates/cli/src/commands.rs` and classifies it as KEPT / STRIPPED /
# DEFERRED per the C-14 plan rule set (re-scoped 2026-05-17). Status values:
#   KEPT      — wired into the elai_cc production flow (has a handler that
#               does meaningful work and ships to end users).
#   STRIPPED  — upstream-only feature with no elai_cc equivalent; UI surface
#               either prints a stub or routes through Unknown.
#   DEFERRED  — decision postponed; re-evaluate at the C-series close
#               (e.g. /plan, /review which overlap planning-workflow tooling).
# Source-of-truth: `pub enum SlashCommand` (commands.rs:1102).
# ---------------------------------------------------------------------------

