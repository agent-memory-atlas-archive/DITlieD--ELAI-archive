# ---------------------------------------------------------------------------
# C-33 extension. Slash command catalog extended to match
# slash_command_specs().len() == 152 (commands.rs:4899). Adds the 5 enum
# variants that landed after the C-14 cut-off (Ask, GraphMermaid, Measure,
# Pipeline, WiringAudit) plus the lower-cased spec-only entries that route
# through SlashCommand::Unknown (no structured dispatch, surface only).
# Convention: PascalCase name = mapped to a SlashCommand enum variant;
# lowercase / kebab-case name = spec entry without enum variant (routes
# through Unknown). Status values KEPT / STRIPPED / DEFERRED as in C-14.
# ---------------------------------------------------------------------------

