[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/rules",
    "crates/providers",
    "crates/tools",
    "crates/plugins",
    "crates/knowledge",
    "crates/reasoning",
    "crates/orchestrator",
    "crates/cli",
    "crates/contracts",
    "crates/agent",
    "crates/ipc-types",
    "crates/web_search",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "process"] }
toml = "1"
tracing = "0.1"
rusqlite = { version = "0.39", features = ["bundled", "array", "hooks"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
regex = "1"
jsonschema = { version = "0.45", default-features = false }
anyhow = "1"
blake3 = "1.8"
postcard = { version = "1.1", features = ["alloc"] }
elai-ipc-types = { path = "crates/ipc-types" }
tracing-log = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
