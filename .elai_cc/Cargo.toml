[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/rules",
    "crates/providers",
    "crates/tools",
    "crates/plugins",
    "crates/knowledge",
    "crates/reasoning",
    "crates/orchestrator",
    "crates/cli",
    "crates/contracts",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
