[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/rules",
    "crates/safety",
    "crates/providers",
    "crates/tools",
    "crates/plugins",
    "crates/knowledge",
    "crates/reasoning",
    "crates/orchestrator",
    "crates/cli",
    "crates/contracts",
    "crates/agent",
    "crates/ipc-types",
    "crates/web_search",
    "crates/scaffold",
    "crates/web_validator",
    "crates/memory",
    # E-54: eval-corpus crate. Repairs D-6's 9-gram filter with 13-gram +
    # embedding-cosine + per-family directory shards + test-triplet schema +
    # matched-pair sycophancy probes + KOR-orthogonality check on D-7.
    # See workflow/reasoning/E-54-decisions.md.
    "crates/eval-corpus",
    # E-29 Tier-B: optional OTLP gRPC exporter for SSB rows. The 4 OTel
    # deps (opentelemetry / opentelemetry_sdk / opentelemetry-otlp /
    # tracing-opentelemetry) are GATED behind the `otlp-export` cargo
    # feature so non-OTLP builds pay zero cost. Anti-slopsquatting
    # verified May 2026 (apache/mit, open-telemetry GitHub org). Live
    # gRPC integration test is RUNPOD-PENDING. See
    # workflow/reasoning/E-29-decisions.md.
    "crates/ssb-otel-export",
    # "crates/dashboard",  # disabled: directory missing (moved to crates/.bkp_old/dashboard); see workspace-manifest-fix in s-1430428
    "crates/dashboard-v2/src-tauri",
    # C-42b (Tranche M, s-22600) -- FIRST proc-macro crate in the workspace.
    # Ships the declarative `#[authz(gate=..., tool_kind=...)]` attribute over
    # the McpAuthz dispatcher surface at crates/plugins/src/authz/compose.rs
    # (`compose_with_tool_gate_emit`). Closes the D.2 Phase C deferral logged
    # in workflow/reasoning/D2-phase-c-deferral.md. Marker-only expansion
    # (no runtime behaviour change); future-lint anchor + dev-UX shorthand.
    # All 4 direct deps (syn 2 / quote 1 / proc-macro2 1 / darling 0.20)
    # already transitively resolved in Cargo.lock -- zero lock churn.
    "crates/plugins_macros",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "process"] }
toml = "1"
tracing = "0.1"
rusqlite = { version = "0.39", features = ["bundled", "array", "hooks"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
regex = "1"
jsonschema = { version = "0.45", default-features = false }
anyhow = "1"
blake3 = "1.8"
lru = "0.18"
postcard = { version = "1.1", features = ["alloc"] }
rustc-hash = "2.1"
elai-ipc-types = { path = "crates/ipc-types" }
tracing-log = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# E-45 Tranche 8A: JSON Schema generation for the sidecar HTTP boundary
# (providers::types::{MessageRequest, MessageResponse, InputMessage,
# SystemBlock, ToolDefinition}). Derive is wire-invisible (only adds
# a schema_for! generator method; serde wire output is unchanged).
# The 5 generated schemas drive the Pydantic mirror regen via
# datamodel-code-generator -- see .claude/tools/regen_sidecar_schemas.py
# and python/elai_inference/schemas/_generated.py.
# Anti-slopsquatting verified 2026-05-31 via crates.io API (latest stable
# 1.2.1, MIT, GREsau/schemars). Pinned EXACT to keep the derive proc-macro
# output byte-stable across rebuilds (snapshot tests in
# crates/orchestrator/tests/schemas_snapshot.rs assume byte-equality).
schemars = "=1.2.1"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = "line-tables-only"

# elai-orchestrator carries multiple very large hand/generated files (ssb/payloads.rs
# ~19.7k lines, ssb/action_type.rs ~6.4k lines with several 330+-arm string->enum
# match fns). Under concurrent build load these blow rustc/LLVM's codegen stack and
# trip the MSVC /GS stack cookie (exit 0xc0000409 STATUS_STACK_BUFFER_OVERRUN), an
# unrecoverable fastfail RUST_MIN_STACK cannot widen (it is a codegen-worker stack).
# More, smaller codegen units cap the IR any single codegen invocation must lower,
# so no unit recurses deep enough to overrun. Behaviour-preserving: codegen-units
# affects only how the crate is partitioned for codegen, never its semantics.
[profile.dev.package.elai-orchestrator]
codegen-units = 256

[profile.release.package.elai-orchestrator]
codegen-units = 256
