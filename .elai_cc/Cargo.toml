[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/rules",
    "crates/providers",
    "crates/tools",
    "crates/plugins",
    "crates/knowledge",
    "crates/reasoning",
    "crates/orchestrator",
    "crates/cli",
    "crates/contracts",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toml = "1"
tracing = "0.1"
rusqlite = { version = "0.39", features = ["bundled", "array", "hooks"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
regex = "1"
jsonschema = { version = "0.45", default-features = false }
blake2 = "0.10"
digest = "0.10"
log = "0.4"
