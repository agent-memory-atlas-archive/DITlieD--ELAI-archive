# P1 — FSM transition idempotent helper landed in feasibility_probe.rs
# (`fsm_transition_idempotent` + `FeasibilityFsmBridge` trait + blanket impl
# on `Fsm`). Production wiring path: orchestrator emits via
# `emit_feasibility_probe_for_pipeline`; FSM bridge installation is a
# follow-on once TaskRunnerConfig accepts an `Option<Arc<dyn FeasibilityFsmBridge>>`.
fsm_transition_helper_present = true
fsm_transition_helper_idempotent_when_already_in_state = true

# P2 / STUB-1 / Tier3 — production system_prober and Tier3StubExecutor
# wired into BOTH runtime_setup::build_task_runner_wiring AND dashboard-v2
# state::AppState::new. Tier3 injection is non-fatal: when
# `elai_cc_agent` is not on disk, the prober falls back to the synthetic
# stub path so contract tests + agentless dev hosts keep passing.
default_feasibility_prober_with_system_prober = true
default_feasibility_prober_with_tier3_executor_when_agent_found = true
tier3_executor_falls_back_to_synthetic_on_binary_missing = true

# P3 — FeasibilityProber trait now exposes 4 spec-named default-method
# shims (`probe_system` / `check_constraints` / `run_stub` / `decide`) that
# delegate to the existing free fns / SyntheticStubExecutor. All shims take
# `&self` so the trait stays object-safe per spec phase-4F.txt L156
# and the dyn-safety contract at feasibility_probe_contract.rs:125.
feasibility_prober_trait_dyn_safe_after_shims = true
feasibility_prober_trait_method_count = 6  # 2 mandatory + 4 default shims

# P4 — `decide_with_mode` now called in production at
# `task_runner.rs::emit_feasibility_probe_for_pipeline` with the
# execution mode resolved from `autonomous_gate.mode()`. The resulting
# `FeasibilityDecision` is logged at info-level and bound (`_ = decision`)
# so the call site is reachable from coverage tooling.
feasibility_decision_called_in_production = true

# P5 — `read_stub_results(path) -> Result<Vec<StubResult>>` reader added
# in feasibility_probe.rs. Tauri `get_stub_results_msgpack(task_id)`
# command exposes it. TS `get_stub_results_msgpack(taskId)` API wrapper +
# FeasibilityPanel.svelte artifact viewer (button + per-row list of
# step_id#alt_index / PASS|FAIL / stdout_hash[0..8] / elapsed_ms) close
# the writer<->reader loop. The on-disk artifact is now consumed end-to-end.
stub_results_msgpack_reader_present = true
stub_results_msgpack_tauri_cmd = "get_stub_results_msgpack"
stub_results_msgpack_ts_wrapper = "get_stub_results_msgpack"
stub_results_msgpack_svelte_consumer = "FeasibilityPanel.svelte:artifact-block"

# P6 — alternative_index loop. `DefaultFeasibilityProber::probe` now drives
# 0..MAX_ALTERNATIVES_PER_STEP attempts per novel step; first PASS short-
# circuits; all attempts FAIL escalates to NoFeasibleAlternative. The
# `NovelStep.alternatives` vector lists the alt slot ids actually tried
# (`{step_id}#alt{n}` for n in 1..). Loop bound is structurally enforced
# by `alternative_within_cap` (debug_assert).
alternative_loop_in_probe = true
alternative_loop_short_circuits_on_first_pass = true
alternative_loop_emits_no_feasible_alternative_on_exhaustion = true

# M1 — nvml-wrapper activation. Cargo.toml flipped from
# `optional = true` to non-optional; vlm-integration feature shrinks to
# `dep:ort` only. system_probe.rs gains `probe_gpu_nvml()` as the primary
# GPU detection path (mirrors media_validator/types.rs:493-519 canonical
# pattern). nvidia-smi shell-out retained as graceful fallback for
# loader-blocked hosts (CI sandboxes, etc).
nvml_wrapper_present = true
nvml_wrapper_optional = false
nvml_wrapper_primary_gpu_probe_path = "probe_gpu_nvml"
nvml_wrapper_fallback_path = "probe_gpu_shell_out (nvidia-smi)"
sysinfo_present = false  # CLAUDE.md no-new-deps rule unchanged; shell-out canonical

