# First request of each context size is slow (~69s for 512, ~193s for 2048)
# Subsequent requests at same size: 3-10s per task
# ctx=3072 (~5100 real tokens): ALL requests timeout at 120s
# Sharp cliff between 2048 and 3072 — not gradual degradation

[attention_timing]
