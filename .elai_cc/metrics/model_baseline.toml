[model_loading]
load_time_s = 330
# 10GB safetensors -> NF4 quantization -> GPU
# Peak CPU RAM during load: 11.1 GB
# Final GPU VRAM: 7.5 GB (model weights)
# Final CPU RAM: 1.8 GB (post-load)

[turboquant]
# From prior evaluation (compose_dola_tq_results.json)
fp16_max_context = 66927
