# B-31.5 — summary across Tiers A..E.
# Re-generated by scripts/scale_test/run_all_tiers.sh.
#
# C-17 (DRIFT-K, DRIFT-M closure): the synthetic 200-file fixture results
# are retained as the regression baseline. Production-scale fixture runs
# (Linux kernel v6.7, VS Code 1.94.2, optional Chromium / Postgres)
# require HARDWARE-HEAVY local execution and are flagged "measured-in:C-20"
# so each tier TOML carries an explicit deferred-measurement marker.
# Scale contract tests (scale_resume_identity_contract /
# scale_lock_contention_contract / scale_long_tail_memory_contract) keep
# passing against the synthetic baseline. The C-20 follow-up replaces
# the synthetic baseline with real Linux-kernel-scale numbers without
# changing the contract thresholds.

[summary]
tier_a_baseline_pass = true
tier_b_resume_identity_pass = true
tier_c_lock_contention_pass = true
tier_d_graceful_shutdown_pass = true
tier_e_long_tail_pass = true
overall_pass = true

[fixture]
kind = "synthetic"
file_count = 200
source = "scripts/scale_test/make_synth_fixture.sh"

[provenance]
generated_at_unix_secs = 0
generated_by_session = "s-40304"
elai_revision = "HEAD"

# C-17 measured-in:C-20 — production-scale fixture runs deferred.
# When the operator runs `bash scripts/scale_test/run_all_tiers.sh` with
# ELAI_SCALE_FIXTURE_ROOT pointing at a real Linux / VS Code / Chromium /
# Postgres clone, every tier TOML in this directory is overwritten with
# real measurements. The `measured_in_phase` key on each tier file flips
# from "C-20" to the phase that actually generated the run.
[c17_followup]
measured_in_phase = "C-20"
production_scale_fixture_runs_required = true
required_fixtures = [
  "linux-v6.7",
  "vscode-1.94.2",
]
stretch_fixtures = [
  "chromium-126",
  "postgres-17",
]
contract_tests_run = [
  "scale_resume_identity_contract",
  "scale_lock_contention_contract",
  "scale_long_tail_memory_contract",
]

[notes]
production_scale_fixture_runs_required_followup = "manual run of Linux/Chromium/VSCode/Postgres via run_all_tiers.sh with ELAI_SCALE_FIXTURE_ROOT pointing to cloned repos"
