notes_text = """
Tier 1 p95 BUDGET BREACH (image=907ms, audio=900ms, ui=908ms, model3d=900ms) is a
DOCUMENTED EXCEPTION under spec phase-4I.txt L351 'or documented exception'.

Root cause (verified by inspection of .elai_cc/crates/orchestrator/src/media_validator/external_tools.rs L154-176 + mod.rs L555 build_capability_flags() called per-request):
  Every pipeline::validate() call spawns 4 sequential `where.exe` subprocesses
  through detect_binary() (one each for magick, ffprobe, tesseract, blender)
  via build_capability_flags(). On Windows cmd.exe / where.exe cold-spawn
  is ~150-250 ms per call. 4 probes x ~220 ms ≈ 860-900 ms which matches the
  observed p50≈p95 latency floor for ALL Tier-1 dispatches.

Fix scope: Group C5 will cache capability flags in Arc<ToolCapabilityFlags> on
MediaValidator at startup (decision 47 in workflow/reasoning/B-24-decisions.md),
dropping per-request overhead from ~900 ms to <1 ms. The functional / contract
/ adversarial tests already pass — this is purely a hot-path optimization.

Mode A / Mode B / GPU-swap measurements: null. Real VLM is gated behind the
vlm-integration feature which requires CUDA + a 24 GB+ VRAM device; the
current host (12 GB VRAM per memory MEMORY.md project_gpu_context) is below
Mode A's MODE_A_MIN_VRAM_GB threshold (types.rs:323). MockVlmBackend is the
only Tier-2 backend exercised here; its latency is recorded as tier2_mock_p95_ms.
VRAM ranges are recorded from grounding (spec L341-343 + workflow/papers/
qwen-vl-internvl-interface.md) rather than measured locally.
"""

