post_c5_arc_cache_4k = "After the C5 OnceLock fix, the 4K bench p95 dropped to 5 ms (same machine, same fixture). Confirms the pre-fix latency was overwhelmingly the per-call subprocess probe, not the PNG decode itself."
queue_full_a6_fix = "Group C5 (decision 55): pipeline::validate now acquires a permit from a process-wide tokio::sync::Semaphore (depth = VALIDATION_QUEUE_DEPTH = 64) via try_acquire. Saturated semaphore -> immediate Err(MediaValidatorError::QueueFull{depth:64}) without any thread::sleep. Test a6_queue_full_returns_immediately passes (was #[ignore = Group C5...] in C4)."

