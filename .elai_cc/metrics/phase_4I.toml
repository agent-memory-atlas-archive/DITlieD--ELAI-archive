#
# Anti-stale grounding (CLAUDE.md):
#   * std::time::Instant (monotonic) — never SystemTime / chrono::Local::now.
#   * u64::try_from() for as_millis() narrowing.
#   * No new dependencies (toml writing uses workspace serde; the bench
#     itself only depends on what's already in dev-deps).
#
# STRUCTURAL NOTE (Group C4 audit WARN-1 fix, decision 53):
# Aggregate keys (tier1_p95_ms, tier2_*_p95_ms, etc.) live under a single
# top-level [metrics] table — NOT under [tier1.<type>] sub-tables — so a
# structured TOML parser (Python's tomllib.load) returns numeric values
# rather than None. Per-type breakdowns live under [metrics.tier1_per_type]
# as inline tables to keep one canonical location per family.

