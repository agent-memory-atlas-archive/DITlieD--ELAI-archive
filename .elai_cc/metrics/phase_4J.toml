# Phase 4J Metrics — Empire Integration (host-side scaffolding)
# Date: 2026-05-22
# Steps completed: 4J.1 scaffolding only (host-side surface). 4J.2-4J.9 are
# EMPIRE-PENDING until the Empire codebase (workspace/factory-brain) is
# accessible — see workflow/reasoning/phase-4J-decisions.md.

[model]
test_model = "n/a (host-side scaffolding; no LLM inference and no live socket I/O)"

[scope]
phase = "4J"
implementation_mode = "host_side_scaffolding"
empire_codebase_accessible = false
pre_resolved_decisions = [
  "1: EMPIRE-PENDING markers on all live-integration seams (RUNPOD-PENDING analog)",
  "2: orchestrator submodule (NOT separate crate); cfg(feature='empire') gating",
  "3: 5 separate SSB action_type variants (NOT single 'empire_event')",
  "4: empire::ipc::EmpireIpcMessageType namespace (avoid IpcMessageType collision)",
  "5: orchestrator.txt 'Section 7 (agents)' -> 'Section 12 (agents+Tier C)'",
  "6: 4J.9 perf numbers labelled UNGROUNDED_TARGET (no prior bench citation)",
]

[empire_bridge]
state_machine_variants = 3  # Disconnected | Connecting | Connected
error_variants = 5  # NotConnected | Encode | Decode | Io | Protocol
event_kind_variants = 5  # Connected | Disconnected | EventReceived | CapabilityInvoked | RepairProposed
empire_pending_markers_count = 11  # grep "EMPIRE-PENDING" in src/empire/* + commands_empire.rs
graceful_degradation = true  # bridge returns NotConnected/empty without panic
zero_unwrap_in_library = true  # production code paths use Result/Option propagation only
zero_lazy_code = true  # no TODO / FIXME / unimplemented! / todo! / placeholder
feature_gate = "cfg(feature = \"empire\")"
non_empire_build_cost = "zero"

[factory_lines]
factory_cmd_variants = 4  # Register | Heartbeat | List | RequestUpdate
ipc_message_type_variants = 9  # RegisterHook | Emit | QueryHooks | Subscribe | Unsubscribe | BusCreate | BusJoin | BusLeave | BusList
engine_tier_variants = 3  # MKI | MKII | MKIII
hook_kind_variants = 2  # Route | Event
brain_manifest_validate_rules = 4  # empty brain_id, empty neurons, duplicate neuron_ids, zero heartbeat
elai_neuron_capability_count = 4  # task_submit | task_status | pipeline_result | health_check
elai_neuron_capability_hardcoded = true  # NEVER dynamic from internal registry (4J.5 adversarial)

[dashboard]
tauri_commands_added = 2  # get_empire_status + list_empire_factory_lines
ts_api_wrappers_added = 2  # get_empire_status + list_empire_factory_lines in api/empire.ts
svelte_components_added = 1  # EmpireBridgePanel.svelte
invoke_calls_in_svelte = 2  # get_empire_status + list_empire_factory_lines invoked on mount + 10s poll
cross_lang_pair_marker_present = true  # "cross-lang-pair: dashboard/tauri/api"
empty_state_message = "Empire bridge unavailable; activate when factory-brain deployed."

[tests]
empire_types_unit_tests = 3  # factory_cmd_round_trip + elai_neuron_has_exactly_four_capabilities + engine_tier_serializes_uppercase
empire_ipc_unit_tests = 2  # all_nine_variants_round_trip + message_round_trip_preserves_mac_and_ip
empire_brain_manifest_unit_tests = 5  # valid + empty_brain_id + empty_neurons + duplicate + zero_heartbeat
empire_factory_line_unit_tests = 3  # encode_terminates_with_single_newline + protocol_version_one + connect_returns_not_connected
empire_bridge_unit_tests = 4  # starts_disconnected + connect_round_trips + emit_action_all_five + factory_lines_empty
empire_commands_unit_tests = 2  # status_shape_has_expected_fields + factory_lines_empty
total_unit_tests = 19

[wire_format]
newline_delimiter = "\n"  # PHASE-4J 4J.3 ADVERSARIAL: NOT "\r\n"
protocol_version = 1  # FactoryLineCommand.v hardcoded per Empire bus.py
encoding = "newline_delimited_json"  # serde_json + b'\n' per frame

# Aspirational targets pulled from 4J.9. These are UNGROUNDED_TARGET per
# PRE-RESOLVED DECISION 6 — neither the orchestrator.txt Firecracker citation
# nor any prior benchmark backs these numbers. They are MEASURE acceptance
# thresholds, not verified prior art. Re-measure once Empire is live and
# replace these placeholders with the actual p50/p95/p99.
[aspirational_targets]
unverified_grounding = "UNGROUNDED_TARGET — no prior benchmark citation available"
connection_latency_unix_ms_target = "<100"
connection_latency_tcp_ms_target = "<500"
heartbeat_jitter_ms_target = "<500"
event_bridge_throughput_per_sec_target = ">=90"  # at rate_limit=100/sec
event_bridge_latency_p95_ms_target = "<10"
capability_status_roundtrip_ms_target = "<50"
capability_submit_roundtrip_ms_target = "<500"
repair_scan_time_ms_target = "<5000"
firecracker_boot_ms_reference = "<125"  # orchestrator.txt:454 — referenced indirectly, ingest before relying on it

[next_steps]
empire_codebase_access_required = true
live_activation_path = "flip the 11 EMPIRE-PENDING markers + add 5-variant SSB lockstep (9-tuple per variant) + SCHEMA_VERSION 97 -> 98 bump"
test_coverage_floor_at_completion = 40  # 4J.9 ACCEPTANCE; current scaffolding ships 19
remaining_work = [
  "FactoryLineTransport trait + Unix/Tcp impls (4J.1)",
  "EventFilter + RateLimiter + Priority (4J.4) + dropped_count metric",
  "ElaiNeuron ToolFilter integration + IPC proxy wire (4J.5)",
  "EmpireRepairTarget + EmpireIssue detection (Python AST) + repair pipeline factory (4J.6)",
  "Cross-platform parity tests over TcpTransport (4J.7)",
  "FSB header parsing + bounded payload_len cap (4J.7)",
  "phase_4J.toml UPDATE with measured numbers when Empire is live (4J.9)",
]

