name = "encore"
version_pin = "v1.57.5"
language = "typescript"
package_manager = "npm"
lint_config_path = "biome.json"
test_runner = "vitest"

# Encore is API-first; the manifest mirrors the DeveloperApi archetype
# checks (OTel + Sentry coverage substitute for Lighthouse on
# server-only deploys, but encore ships an admin dashboard so
# lighthouse stays in scope at low priority). Order matters — runners
# dispatch in this sequence.
security_checks = [
    "secrets_scan",
    "trufflehog_scan",
    "owasp_static",
    "npm_audit",
    "biome",
    "otel_check",
    "sentry_check",
    "lsof_port",
]
