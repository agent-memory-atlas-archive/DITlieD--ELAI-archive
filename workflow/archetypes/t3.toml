# E-12 Tier-B framework manifest: T3 (create-t3-app) — Next.js + tRPC + Prisma + NextAuth
#
# Anti-slopsquatting verification (CLAUDE.md HARD RULE):
#   * canonical repo: https://github.com/t3-oss/create-t3-app (org
#     "t3-oss" verified via WebFetch 2026-05-31)
#   * canonical docs: https://create.t3.gg / https://t3.gg
#   * npm install surface: `npm create t3-app@latest` (registry metadata
#     at registry.npmjs.org/create-t3-app confirms `latest` dist-tag
#     = 7.40.0 with license MIT).
#   * canonical version tag returned by GitHub Releases on 2026-05-31:
#     7.40.0 (released 2024-11-05 per github.com/t3-oss/create-t3-app/releases/latest;
#     within 24-month freshness window per CLAUDE.md anti-slopsquatting
#     protocol — note that T3 is a scaffold project where the release
#     cadence is intentionally slow; the per-stack components in the
#     generated package.json carry their own version pins and are
#     checked by `npm_audit` at deploy time).
#   * license: MIT (verified via registry.npmjs.org/create-t3-app 2026-05-31).
