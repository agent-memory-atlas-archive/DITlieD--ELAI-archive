# VERIFIED 2026-05-31 via github.com/t3-oss/create-t3-app/releases/latest +
# registry.npmjs.org/create-t3-app per s-22600 Tranche A ITEM 5
# anti-slopsquat sweep.

name = "t3"
version_pin = "7.40.0"
language = "typescript"
package_manager = "pnpm"
lint_config_path = "biome.json"
test_runner = "vitest"

# T3 ships a SaasDashboard archetype with Next.js App Router + auth +
# data layer; the manifest mirrors nextjs15 except adds sentry_check
# (T3's NextAuth integration commonly exports a Sentry trace surface).
# Order matters — runners dispatch in this sequence.
security_checks = [
    "secrets_scan",
    "trufflehog_scan",
    "owasp_static",
    "npm_audit",
    "biome",
    "lighthouse",
    "otel_check",
    "sentry_check",
    "lsof_port",
]
