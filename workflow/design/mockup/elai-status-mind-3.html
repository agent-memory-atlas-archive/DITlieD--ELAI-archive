<!--
  design read: a living neural organism status view for the owner, the mind rendered as a dendrite that buds and grows toward a finished form as ELAI completes, leaning aesthetic/organic. the owner-approved 150->270 lain gradient carries section identity (each plan letter = one hue stop); data recedes into a soft side column, the organism is the surface.
  dials: STRUCTURE_VARIANCE 7 / MOTION_INTENSITY 5 / VISUAL_DENSITY 3
-->
<title>ELAI status // organism</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap');

  :root{
    --ground:#060a12;
    --sink:#04070d;
    --panel:rgba(9,14,24,.72);
    --line:rgba(140,190,220,.12);
    --line-2:rgba(150,200,225,.22);
    --text:#eaf1f8;
    --text-2:#c4d1de;
    --dim:#8394a7;
    --dim-2:#5e6c7e;
    --teal:#35f1e2;
    --teal-deep:#0c4a46;
    --chip:#eaf7f4;
    --chip-ink:#06120f;
    --font-ui:'Hanken Grotesk',system-ui,sans-serif;
    --font-data:'JetBrains Mono',monospace;
    --r:2px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:radial-gradient(130% 100% at 34% 46%,#0a1120 0%,var(--ground) 62%,var(--sink) 100%);
    color:var(--text);font-family:var(--font-ui);font-size:13.5px;overflow:hidden;position:relative}

  #organism{position:fixed;inset:0;z-index:0;display:block}

  /* left hue legend — the lain ramp made literal (each plan letter = a hue stop) */
  .ramp{position:fixed;left:22px;top:50%;transform:translateY(-50%);z-index:3;display:flex;flex-direction:column;gap:2px}
  .ramp .rr{display:flex;align-items:center;gap:8px}
  .ramp .sw{width:12px;height:12px;border-radius:1px}
  .ramp .rl{font-family:var(--font-data);font-size:10px;color:var(--dim)}
  .ramp .rc{font-family:var(--font-data);font-size:9px;color:var(--dim-2)}
  .ramp-cap{font-size:10px;color:var(--dim-2);margin-bottom:6px;letter-spacing:.02em}

  /* headline — quiet, top-center, the one number */
  .headline{position:fixed;top:30px;left:50%;transform:translateX(-50%);z-index:3;text-align:center;pointer-events:none}
  .hl-num{font-family:var(--font-data);font-weight:700;font-size:76px;line-height:.8;color:var(--text);letter-spacing:-.03em}
  .hl-lab{font-size:13px;color:var(--dim);margin-top:4px}
  .hl-sub{font-family:var(--font-data);font-size:9.5px;color:var(--dim-2);margin-top:4px;letter-spacing:.05em}
  .brandw{position:fixed;top:22px;left:22px;z-index:3;font-weight:700;font-size:13px;letter-spacing:.05em;color:var(--text-2)}
  .brandw span{font-family:var(--font-data);font-size:9px;color:var(--dim-2);display:block;letter-spacing:.2em;margin-top:2px}

  /* soft data column, right — recedes behind the organism */
  .sheet{position:fixed;top:0;right:0;bottom:0;width:346px;z-index:4;
    background:linear-gradient(270deg,rgba(6,10,18,.92),rgba(6,10,18,.62) 82%,transparent);
    padding:20px 22px 24px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
  .card{margin-bottom:18px}
  .chead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
    border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:8px}
  .ctitle{font-weight:600;font-size:12.5px;color:var(--text)}
  .cstamp{font-family:var(--font-data);font-size:9px;color:var(--dim-2)}
  .cstamp.stale{color:var(--chip-ink);background:var(--chip);padding:1px 5px;border-radius:var(--r);font-weight:500}

  .prow{display:flex;gap:9px;padding:5px 0;border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .pmk{width:8px;height:8px;flex:none;margin-top:4px}
  .pmk.conf{background:var(--teal)}
  .pmk.susp{border:1px dashed var(--dim);background:transparent}
  .pid{font-family:var(--font-data);font-size:11px;color:var(--teal);flex:none;width:52px;font-weight:500}
  .pt{font-size:11.5px;color:var(--text-2);line-height:1.3}
  .pmeta{font-family:var(--font-data);font-size:9px;color:var(--dim);margin-top:2px}
  .pmeta .d{color:var(--teal)} .pmeta .d.s{color:var(--dim)}

  .buckets{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .bkt{flex:1 1 44%;background:var(--sink);border:1px solid var(--line);border-radius:var(--r);padding:6px 8px}
  .bkt .n{font-family:var(--font-data);font-size:14px;color:var(--text-2);font-weight:500}
  .bkt .l{font-size:9px;color:var(--dim);margin-top:1px}

  .brow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
  .brow:last-child{border-bottom:0}
  .bn{font-size:12px;color:var(--text-2)}
  .bval{font-family:var(--font-data);font-size:10px;color:var(--dim);text-align:right}
  .bval.err{background:var(--chip);color:var(--chip-ink);padding:1px 6px;border-radius:var(--r);font-weight:700}
  .bval.gpu{color:var(--dim-2)}

  .rrow{display:flex;align-items:center;gap:9px;padding:5px 0;border-bottom:1px solid var(--line)}
  .rrow:last-child{border-bottom:0}
  .rbar{width:26px;height:8px;flex:none}
  .rbar.keep{background:var(--teal-deep);border-right:2px solid var(--teal)}
  .rbar.redo{background:transparent;border:1px solid var(--teal)}
  .rbar.ns{background:transparent;border:1px dashed var(--dim-2)}
  .rv{flex:1;font-size:12px;color:var(--text-2)}
  .rs{font-family:var(--font-data);font-size:9.5px;color:var(--dim)}

  .hrow{display:flex;align-items:baseline;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)}
  .hrow:last-child{border-bottom:0}
  .hl{font-size:12px;color:var(--text-2)}
  .hv{font-family:var(--font-data);font-size:13px;color:var(--text)}
  .hv.err{font-size:9.5px;background:var(--chip);color:var(--chip-ink);padding:1px 6px;border-radius:var(--r);font-weight:700}
  .herr{font-family:var(--font-data);font-size:9px;color:var(--dim);margin-top:5px}

  .mline{display:flex;align-items:center;gap:9px;padding:4px 0}
  .mlab{font-size:11px;color:var(--text-2);width:92px;flex:none}
  .track{flex:1;height:6px;background:var(--sink);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .fill{height:100%;background:var(--teal-deep);border-right:2px solid var(--teal)}
  .mpct{font-family:var(--font-data);font-size:11px;color:var(--text);width:32px;text-align:right;flex:none}
  .lanes{margin-top:8px;border-top:1px solid var(--line);padding-top:7px;display:grid;gap:3px}
  .lane{display:flex;justify-content:space-between;gap:8px}
  .lane .ln{font-size:10.5px;color:var(--dim)}
  .lane .tok{font-family:var(--font-data);font-size:10px;color:var(--text-2)}
  .lane .tok .a{color:var(--dim-2)}

  @media (max-width:1080px){
    .sheet{width:300px}
    .ramp{display:none}
    .hl-num{font-size:60px}
  }
  @media (max-width:760px){
    .sheet{position:static;width:auto;background:rgba(6,10,18,.9);height:auto;min-height:100vh}
    #organism{opacity:.4}
    .headline{position:static;transform:none;padding:60px 0 10px}
  }
</style>

<canvas id="organism"></canvas>
<div class="brandw">TEIKOKU<span>ELAI · STATUS</span></div>

<div class="ramp" id="ramp"></div>

<div class="headline">
  <div class="hl-num" id="hl-num">0</div>
  <div class="hl-lab">open</div>
  <div class="hl-sub" id="hl-sub">as of —</div>
</div>

<div class="sheet" id="sheet"></div>

<script>
const status = {
  generated_at_ago:"4m",
  open_count:7,
  open_items:[
    {id:"I-33",t:"zero-caller symbol",meta:"production_caller_check · P0",dead:"CONFIRMED"},
    {id:"H-10",t:"PagerankPanel orphan",meta:"svelte_mount_reachability · P0",dead:"CONFIRMED"},
    {id:"C-15",t:"entropy-gate regression",meta:"wiring_contract_check · P1",dead:"CONFIRMED"},
    {id:"B-4",t:"stale doc-comment",meta:"doc_freshness · P1",dead:"SUSPECTED"},
    {id:"H-Tr3",t:"gates built, not intercepting",meta:"gate_freeze_check · P1",dead:"SUSPECTED"},
    {id:"I-41",t:"dead framing surface",meta:"python_wire_check · P1",dead:"SUSPECTED"},
    {id:"D-17",t:"verifier retention unproven",meta:"ssb_journal · P1",dead:"SUSPECTED"},
  ],
  buckets:{registered_dark:41,gpu_blocked:12,user_deferred:8,verify_debt:11},
  letters:[
    {L:"B",total:45,wired:40},{L:"C",total:45,wired:37},{L:"D",total:30,wired:19},
    {L:"E",total:55,wired:47},{L:"F",total:13,wired:13},{L:"G",total:9,wired:7},
    {L:"H",total:52,wired:41},{L:"I",total:54,wired:38},{L:"J",total:30,wired:22},
    {L:"K",total:18,wired:9},{L:"L",total:14,wired:6},{L:"M",total:12,wired:3},{L:"N",total:8,wired:1},
  ],
  benchmarks:[
    {name:"SAFEDELTA",harness:true,run:false,gpu:true},
    {name:"QDELTA",harness:true,run:false,gpu:false},
    {name:"gate-tax",harness:true,run:false,gpu:false},
    {name:"routing-economics",harness:true,run:false,gpu:false},
    {name:"hallucination-delta",harness:false,run:false,gpu:false,error:true},
  ],
  health:{dead_ipc:5,orphan_error:"svelte_mount_reachability: exit 2"},
  ui_rework:[
    {v:"Command",s:"keep"},{v:"Activity",s:"redo"},{v:"Monitor",s:"redo"},
    {v:"Explore",s:"not-started"},{v:"Review",s:"keep"},{v:"Plan",s:"redo"},{v:"Settings",s:"keep"},
  ],
  usage:{five_hour:45,weekly:48,weekly_model:36,lanes:[
    {lane:"claude",tin:"2.1M",tout:"340K"},
    {lane:"free-gemini",tin:"8.4M",tout:"1.2M"},
    {lane:"codex",tin:"900K",tout:"210K"},
  ]},
  stamps:{burndown:"4m",bench:"6m",rework:"2h 40m",health:"4m",usage:"31s"},
};

const HUE0=150,HUE1=270;
const letters=status.letters, NL=letters.length;
function hueFor(i){ return HUE0+(HUE1-HUE0)*(i/(NL-1)); }

/* ---------- left hue legend ---------- */
document.getElementById('ramp').innerHTML =
  `<div class="ramp-cap">plan letter · hue</div>` +
  letters.map((L,i)=>{
    const h=hueFor(i);
    return `<div class="rr"><span class="sw" style="background:hsl(${h},78%,58%)"></span>
      <span class="rl">${L.L}</span><span class="rc">${L.wired}/${L.total}</span></div>`;
  }).join('');

/* ---------- build the dendrite organism ---------- */
const cv=document.getElementById('organism'), ctx=cv.getContext('2d');
let W,H,DPR;
function resize(){ DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0); build(); }
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

let branches=[];
function build(){
  branches=[];
  const cx=W*0.40, cy=H*0.52;                 // soma sits left-of-center, sheet lives right
  const scale=Math.min(W,H)/900;
  letters.forEach((L,i)=>{
    const hue=hueFor(i);
    const a0=(i/NL)*Math.PI*2 - Math.PI/2 + (i%2?0.14:-0.10);
    const reach=(120+L.total*3.2)*scale;
    // main polyline: gentle random-walk outward (seeded by index for stability)
    let seed=i*97.13;
    const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
    const verts=[[cx,cy]]; let x=cx,y=cy,ang=a0; const steps=6;
    for(let s=0;s<steps;s++){ ang+=(rnd()-0.5)*0.5; const seg=reach/steps;
      x+=Math.cos(ang)*seg; y+=Math.sin(ang)*seg; verts.push([x,y]); }
    // buds along the branch: first `wired` lit, rest dark, distributed by param
    const buds=[];
    for(let k=0;k<L.total;k++){
      const t=(k+0.6)/(L.total);         // 0..1 along branch
      const seg=t*(verts.length-1), si=Math.min(verts.length-2,Math.floor(seg)), f=seg-si;
      const px=verts[si][0]+(verts[si+1][0]-verts[si][0])*f;
      const py=verts[si][1]+(verts[si+1][1]-verts[si][1])*f;
      const perp=Math.atan2(verts[si+1][1]-verts[si][1],verts[si+1][0]-verts[si][0])+Math.PI/2;
      const off=(rnd()-0.5)*14*scale*t;
      buds.push({x:px+Math.cos(perp)*off, y:py+Math.sin(perp)*off, t,
        lit:k<L.wired, open:false});
    }
    branches.push({hue,verts,buds,letter:L.L});
  });
  // mark open gaps: spread status.open_count across dark buds
  const dark=[]; branches.forEach(b=>b.buds.forEach(bd=>{ if(!bd.lit) dark.push(bd); }));
  const step=Math.max(1,Math.floor(dark.length/status.open_count));
  for(let j=0;j<status.open_count;j++){ const t=dark[j*step]; if(t)t.open=true; }
}
resize(); addEventListener('resize',resize);

function drawFrame(g){    // g = growth 0..1
  ctx.clearRect(0,0,W,H);
  const cx=W*0.40, cy=H*0.52;
  // soma
  ctx.save();
  ctx.shadowBlur=reduce?0:26; ctx.shadowColor='rgba(53,241,226,.5)';
  ctx.fillStyle='rgba(53,241,226,.9)';
  ctx.beginPath();ctx.arc(cx,cy,4.5,0,7);ctx.fill();
  ctx.restore();

  branches.forEach(b=>{
    // grown length of the polyline
    const grown=g;
    // stroke the branch as a gradient soma->tip
    const last=b.verts[b.verts.length-1];
    const grad=ctx.createLinearGradient(cx,cy,last[0],last[1]);
    grad.addColorStop(0,'rgba(53,241,226,.30)');
    grad.addColorStop(1,`hsla(${b.hue},80%,60%,.42)`);
    ctx.strokeStyle=grad; ctx.lineWidth=1.4; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(b.verts[0][0],b.verts[0][1]);
    const totalSeg=b.verts.length-1, shown=totalSeg*grown;
    for(let s=1;s<b.verts.length;s++){
      if(s<=shown){ ctx.lineTo(b.verts[s][0],b.verts[s][1]); }
      else { const f=shown-(s-1); if(f>0){
        ctx.lineTo(b.verts[s-1][0]+(b.verts[s][0]-b.verts[s-1][0])*f,
                   b.verts[s-1][1]+(b.verts[s][1]-b.verts[s-1][1])*f); } break; }
    }
    ctx.stroke();

    // buds
    b.buds.forEach(bd=>{
      if(bd.t>grown) return;
      const app=Math.min(1,(grown-bd.t)*6);   // ignite as the branch reaches it
      if(bd.open){
        ctx.strokeStyle=`rgba(234,241,248,${0.4+0.4*(reduce?1:(0.5+0.5*Math.sin(performance.now()*0.003+bd.x)))})`;
        ctx.lineWidth=1.3; ctx.strokeRect(bd.x-3,bd.y-3,6,6);
      } else if(bd.lit){
        ctx.save();
        ctx.shadowBlur=reduce?0:9; ctx.shadowColor=`hsla(${b.hue},90%,62%,.8)`;
        ctx.fillStyle=`hsla(${b.hue},85%,${52+app*10}%,${0.55+app*0.4})`;
        ctx.fillRect(bd.x-2,bd.y-2,4,4);
        ctx.restore();
      } else {
        ctx.strokeStyle=`hsla(${b.hue},30%,46%,.22)`;
        ctx.lineWidth=1; ctx.strokeRect(bd.x-1.5,bd.y-1.5,3,3);
      }
    });
  });
}

if(reduce){
  drawFrame(1);
}else{
  const t0=performance.now();
  (function loop(now){
    const g=Math.min(1,(now-t0)/2600);
    const eased=1-Math.pow(1-g,3);       // ease-out cubic
    drawFrame(eased);
    // after grown, keep a gentle breathing redraw so open gaps flicker
    if(g<1) requestAnimationFrame(loop);
    else { (function idle(){ drawFrame(1); requestAnimationFrame(idle); })(); }
  })(t0);
}

/* ---------- soft data sheet ---------- */
function card(title,stamp,stale,inner){
  return `<div class="card"><div class="chead"><span class="ctitle">${title}</span>
    <span class="cstamp${stale?' stale':''}">${stale?'STALE · ':''}as of ${stamp} ago</span></div>${inner}</div>`;
}
const burndown =
  status.open_items.map(o=>{ const c=o.dead==='CONFIRMED';
    return `<div class="prow"><span class="pmk ${c?'conf':'susp'}"></span>
      <span class="pid">${o.id}</span><span><span class="pt">${o.t}</span>
      <span class="pmeta">${o.meta} · <span class="d${c?'':' s'}">${o.dead}-DEAD</span></span></span></div>`;
  }).join('') +
  `<div class="buckets">
    <div class="bkt"><div class="n">${status.buckets.registered_dark}</div><div class="l">registered-dark</div></div>
    <div class="bkt"><div class="n">${status.buckets.gpu_blocked}</div><div class="l">gpu-blocked</div></div>
    <div class="bkt"><div class="n">${status.buckets.user_deferred}</div><div class="l">user-deferred</div></div>
    <div class="bkt"><div class="n">${status.buckets.verify_debt}</div><div class="l">verify-debt</div></div>
  </div>`;
const bench = status.benchmarks.map(b=>{ let cls='',v;
  if(b.error){cls=' err';v='ERROR · no harness';} else if(b.gpu){cls=' gpu';v='NOT RUN · gpu';} else v='NOT RUN';
  return `<div class="brow"><span class="bn">${b.name}</span><span class="bval${cls}">${v}</span></div>`;
}).join('');
const rework = status.ui_rework.map(r=>{ const cl=r.s==='keep'?'keep':r.s==='redo'?'redo':'ns';
  return `<div class="rrow"><span class="rbar ${cl}"></span><span class="rv">${r.v}</span><span class="rs">${r.s}</span></div>`;
}).join('');
const health =
  `<div class="hrow"><span class="hl">dead IPC wires</span><span class="hv">${status.health.dead_ipc}</span></div>
   <div class="hrow"><span class="hl">orphan components</span><span class="hv err">ERROR · exit 2</span></div>
   <div class="herr">${status.health.orphan_error}</div>`;
const u=status.usage;
const usage =
  `<div class="mline"><span class="mlab">5h window</span><span class="track"><span class="fill" style="width:${u.five_hour}%"></span></span><span class="mpct">${u.five_hour}%</span></div>
   <div class="mline"><span class="mlab">weekly</span><span class="track"><span class="fill" style="width:${u.weekly}%"></span></span><span class="mpct">${u.weekly}%</span></div>
   <div class="mline"><span class="mlab">weekly · model</span><span class="track"><span class="fill" style="width:${u.weekly_model}%"></span></span><span class="mpct">${u.weekly_model}%</span></div>
   <div class="lanes">`+u.lanes.map(l=>`<div class="lane"><span class="ln">${l.lane}</span><span class="tok">${l.tin} in <span class="a">/</span> ${l.tout} out</span></div>`).join('')+`</div>`;

document.getElementById('sheet').innerHTML =
  card('punch-list burndown',status.stamps.burndown,false,burndown) +
  card('benchmarks board',status.stamps.bench,false,bench) +
  card('ui-rework backlog',status.stamps.rework,true,rework) +
  card('dashboard health',status.stamps.health,false,health) +
  card('usage · max plan',status.stamps.usage,false,usage);

document.getElementById('hl-num').textContent=status.open_count;
document.getElementById('hl-sub').textContent='as of '+status.generated_at_ago+' ago';
</script>
