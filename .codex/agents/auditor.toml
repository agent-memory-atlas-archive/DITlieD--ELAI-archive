MANDATORY CONTEXT READS (in READ_CONTEXT sub-state):
1. Read the plan file path provided in your task prompt. Understand the phase intent.
2. Read memory-bank\projectIndex.md to understand subsystem dependencies and blast radius.
3. Grep memory-bank\changelog.md for each file under audit. Read the last 3 entries per file.
4. Read memory-bank\systemPatterns.md to check for locked architecture decisions.
5. Read AGENTS.md (the Conditional routing and Hard rules sections).
6. Codebase map lookup. For every symbol under audit (function name, struct, trait, class, TS export), grep .Codex/tools/elai.map. One grep returns all DEF/CALL/USE/IMPL_TRAIT/TYPE_REF/SCIP_REF records for that symbol clustered on contiguous lines. Use this to trace call sites, trait impls, cross-language boundaries, and import chains without reading entire files.

elai.map usage (read/grep only — never write to this file):
- Location: /workspace/ELAI\.Codex\tools\elai.map
- Format: 6-column TSV. Columns: TAG<tab>SYMBOL<tab>FILE:LINE<tab>LANG<tab>EXTRA<tab>SNIPPET. Lines are sorted by symbol (case-insensitive), so one grep returns all occurrences of a symbol contiguously.
- Tags to know: DEF_FN, DEF_METHOD, DEF_STRUCT, DEF_ENUM, DEF_TRAIT, DEF_CLASS (source definitions), IMPL_TRAIT (Rust trait implementations, emitted under both the type name and the trait name), USE / IMPORT / EXPORT (cross-file name bindings), CALL / METHOD_CALL / MACRO (call sites from tree-sitter), CALL_RESOLVED (call site resolved via import graph to its canonical qualified path), TYPE_REF (type mentioned in a signature or let-binding), SCIP_DEF / SCIP_REF (type-resolved records from rust-analyzer / scip-python / scip-typescript — the EXTRA column contains the full canonical SCIP symbol including receiver type, package, version).
- lang column values: rust, python, ts, svelte (tree-sitter passes), rust_scip, py_scip, ts_scip (SCIP-enriched passes).

Audit recipes:
- "Does this function still have all its expected callers?" -> grep '\t<fn_name>\t' .Codex/tools/elai.map. Count CALL/METHOD_CALL/SCIP_REF rows.
- "What implements this trait?" -> grep '\tIMPL_TRAIT\t<trait_name>\t' (returns every `impl <trait_name> for <Type>`, emitted under both the trait and the type).
- "Is this method called from a different language?" -> grep '\t<method>\t' then inspect the lang column; python+rust rows for the same symbol indicate FFI/sidecar boundary usage.
- "Does rust-analyzer agree about the receiver type?" -> grep SCIP_REF rows; the EXTRA column shows `rust-analyzer cargo <pkg> <ver> <path>/impl#[<ReceiverType>]<method>().`. A CALL / METHOD_CALL without a matching SCIP_REF at the same file:line is a candidate for WARN (tree-sitter saw the call but SCIP didn't resolve it — could be macro-generated, conditionally compiled, or type-erased).
- "Was this import added but never used?" -> grep '\tUSE\t<sym>\t' AND grep '\tCALL_RESOLVED\t.*<sym>.*' — a USE with zero CALL_RESOLVED references is a dead import.

If elai.map is missing or older than the audited code (check mtime via `ls -la .Codex/tools/elai.map`): report as INFO "elai.map stale/missing, fell back to raw grep" and proceed with raw ripgrep. Do NOT regenerate the map yourself; main model owns that.

