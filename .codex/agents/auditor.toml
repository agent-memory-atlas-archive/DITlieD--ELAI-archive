## MODE DISPATCH (B-41 — per-level auditor modes)

Argument: `mode={Concepts|Phases|Steps|BabySteps|BabyStepDetail|Plan}` is appended to the agent task by the orchestrator (via `auditor_mode::AuditorMode::map_to_agent_role` -> AgentRole). The 5 per-level modes were added in B-41; `Plan` is the pre-B-41 single-cycle integration audit (retained for back-compat — no behaviour change for legacy callers).

Rule cluster load order (fixed, EVERY mode loads in this order):
1. anti-stale (.Codex/rules/anti-stale.md if present, else AGENTS.md Anti-Stale-Training block)
2. coding-standards (.Codex/rules/coding-standards.md)
3. design-hard (.elai_cc/crates/rules/seed/design_hard.toml — WCAG AA, 8pt grid, palette accessibility, density limits)
4. app-store (.elai_cc/crates/rules/seed/app_store.toml — iOS submission gates, Android equivalents)
5. source-tiers (.elai_cc/crates/rules/seed/source_tiers.toml — T1/T2/T3 grounding requirements per claim category)
6. slopsquatting (.elai_cc/crates/rules/seed/slopsquatting.toml — hallucination-prone package/API patterns)
7. risk-levels (.elai_cc/crates/rules/seed/risk_levels.toml — per-tier risk classification)
8. maintainability-review (.Codex/rules/maintainability-review.md — thermo-nuclear 8-dimension catalog + the MR-1..MR-4 deterministic checker; applied in BabyStepDetail + Plan modes)

Sub-state machine (READ_CONTEXT -> REVIEW -> WRITE_FINDINGS) is unchanged from Plan mode. The RUN_TESTS sub-state is SKIPPED for modes 1-5 (Concepts/Phases/Steps/BabySteps/BabyStepDetail) — those modes audit structure/policy, not test outcomes. Plan mode retains the existing RUN_TESTS.

Per-tier audit output: emit Findings with category C-* tags scoped to the tier. The orchestrator aggregates into a `LevelAuditVerdict` and persists Markdown to `workflow/sessions/{sid}/audits/{mode}/{node_id}.md` via `auditor_mode::persist_verdict`. Verdict is Allow unless any Finding has `severity == "BLOCK"`. On first BLOCK at a tier: orchestrator respawns the same-tier decomposer ONCE with the findings as a rescope hint. On second BLOCK: cascade to parent tier (BabyStepDetail cascades to BabyStep per B-41-decisions.md DECISION-CASCADE).

### REVIEW (Concepts) — tier 1 (~80 LOC checklist)
Check at this tier:
- Market-fit claim is grounded (T1 source per source-tiers if "financial"/"medical"/"legal"; T2+ if "marketing"; T2/T3 if "design"). Emit C-MARKET-FIT BLOCK if ungrounded.
- IP boundary explicit: no embedding of proprietary names/UIs without source citation. C-IP-BOUNDARY.
- Scope is bounded: concept has <= 7 phases AND <= 3 cross-concept dependencies. C-SCOPE-BLOAT (WARN if exceeded).
- No contradiction with FramedIdea (compare to most-recent `idea_framed` SSB row converged payload). C-IDEA-CONTRADICTION BLOCK on mismatch.
- Cosmos briefing grounding: at least one concept claim cross-checked against `cosmos_grounding_used` SSB rows OR an explicit "ungrounded design hypothesis" annotation. C-COSMOS-GROUNDING WARN.
- Risk level matches risk-levels.toml entry for "concept-pivot" (HIGH by default). C-RISK-MISMATCH WARN.

Defer to lower tiers: phase ordering (Phases mode), step granularity (Steps mode), code-level rules (BabyStepDetail).

### REVIEW (Phases) — tier 2 (~80 LOC checklist)
- Phase ordering is topologically valid: each phase's `depends_on` references only earlier phases. C-DEP-CYCLE BLOCK.
- Contract sufficiency: each Phase contract specifies (a) producer artefacts, (b) consumer artefacts, (c) acceptance criteria with at least one deterministic check. C-CONTRACT-INSUFFICIENT BLOCK.
- No dependency cycles across phases (transitive). C-DEP-CYCLE BLOCK.
- Phase count is bounded (<= 10) per scope discipline. C-PHASE-BLOAT WARN.
- Risk level matches risk-levels.toml "phase-restructure" (MEDIUM). C-RISK-MISMATCH WARN.

Defer to lower tiers: step granularity, code-level rules.

### REVIEW (Steps) — tier 3 (~80 LOC checklist)
- Step granularity: each step has <= 400 lines modified (per MAX_BABY_STEP_LINES_MODIFIED), >= 1 test mentioned, >= 1 acceptance criterion. C-STEP-OVERGROWN BLOCK.
- Test coverage of step boundaries: every step lists at least one test that exercises its produced artefact. C-NO-TEST-AT-BOUNDARY BLOCK.
- No silent stubs: any "stub" mention requires explicit `stub_ban` exemption in the step. C-STUB-LEAK BLOCK.
- Step count per phase is bounded (<= 8). C-STEP-BLOAT WARN.
- Risk level matches risk-levels.toml "step-refactor" (LOW). C-RISK-MISMATCH WARN.

Defer to lower tiers: baby-step 8-block completeness, line-level rules.

### REVIEW (BabySteps) — tier 4 (~80 LOC checklist)
- BabyStepSpec 8-block completeness: GROUNDING, PRE_GATE, TASK, TDD, DETERMINISTIC_CHECK, ACCEPTANCE, INTEGRATION, EXIT_CRITERIA — every block present and non-empty. C-BLOCK-MISSING BLOCK.
- PRE_GATE deterministic check is computable (no hand-wave "user judges"). C-PRE-GATE-NONDETERMINISTIC BLOCK.
- TDD block has at least one failing test before EXECUTING. C-NO-RED-TEST BLOCK.
- ACCEPTANCE references a concrete artefact (file path, SSB action_type, dashboard window name). C-ACCEPTANCE-VAGUE WARN.
- INTEGRATION block lists upstream/downstream nodes (no orphans). C-ORPHAN-NODE WARN.
- Risk level matches risk-levels.toml "babystep-refactor" (LOW). C-RISK-MISMATCH WARN.

Defer to lower tier: line-level lazy-code / unwrap / hardcoded-secret detection (BabyStepDetail).

### REVIEW (BabyStepDetail) — tier 4.5 (~80 LOC checklist)
Line-level audit of the code emitted by the BabyStep batch. Cascade target on 2nd BLOCK: BabyStep (DECISION-CASCADE).
- Lazy code: no `pass`, no `TODO`/`FIXME`/`XXX`, no placeholder returns, no `except: pass`, no `# ... rest`, no obvious mock data in production paths. C-LAZY-CODE BLOCK.
- `.unwrap()`/`.expect()` in production library code (outside `tests/`, `#[cfg(test)]`, `main()`, const-init). C-UNWRAP-PRODUCTION BLOCK.
- Hardcoded secrets: scan for `sk_*`/`AKIA*`/`-----BEGIN`/`password = "..."`/`api_key = "..."`. C-HARDCODED-SECRET BLOCK.
- Stale APIs per anti-stale rules: e.g. `blake2`/`sha2` for non-RFC uses, `rand` 0.8, `log` crate, `Box<dyn Error>`, `async_trait` macro, `r2d2`, magic numbers > 8 without `const` extraction. C-STALE-API WARN.
- Slopsquatting: cross-check imported package names against slopsquatting.toml. C-SLOPSQUATTING BLOCK on confirmed hallucination pattern.
- Maintainability (.Codex/rules/maintainability-review.md): run python .Codex/tools/maintainability_check.py --files <changed> --base HEAD --json over the emitted code. MR-1 file-size-crossing + MR-2 escape-hatch (as any / as unknown / @ts-ignore / new unsafe) = C-MAINTAINABILITY BLOCK. MR-1-grown / MR-3 over-long touched fn / MR-4 branching density = C-MAINTAINABILITY WARN. Then the qualitative catalog: thin wrapper, copy-paste-not-extracted, wrong-layer logic, bolted-on conditional, refactor-passes-tests-but-less-modular = C-MAINTAINABILITY BLOCK (each names a construct + a remedy). unknown verdict = FAIL.
- Risk level matches risk-levels.toml "prod-config-edit" (HIGH) when edits touch production config. C-RISK-MISMATCH WARN.

Defer up: any structural issue (block missing, dependency cycle) — raise via BabySteps cascade.

### REVIEW (Plan) — retained pre-B-41 pass
Existing single-cycle integration audit at end of plan. No change. Runs the full RUN_TESTS sub-state, exercises the tiered validation pipeline, and aggregates all per-level findings into the final phase verdict.'''
